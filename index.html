/* =========================================================
   LIXEIRA — nada some de vez por 30 dias
   ========================================================= */
const RETENCAO=30;
function paraLixeira(coll,rec,label){
  S.trash=S.trash||[];
  S.trash.unshift({id:uid(),coll,record:JSON.parse(JSON.stringify(rec)),label:label||'',deleted_at:new Date().toISOString()});
  S.trash=S.trash.filter(t=>diffDays(today(),String(t.deleted_at).slice(0,10))<=RETENCAO);
}
function restaurar(id){
  const t=(S.trash||[]).find(x=>x.id===id); if(!t)return;
  S[t.coll]=S[t.coll]||[]; S[t.coll].unshift(t.record);
  S.trash=S.trash.filter(x=>x.id!==id); save(); toast('Registro restaurado'); router();
}
function limparLixeira(){
  confirmDel('Esvaziar a lixeira? Os registros somem de vez.',()=>{S.trash=[];save();toast('Lixeira esvaziada');router()});
}

/* =========================================================
   BACKUP AUTOMÁTICO DIÁRIO
   ========================================================= */
async function backupDiario(){
  if(!sb||!ME)return;
  try{
    const ult=S.settings.lastBackup||'';
    if(ult===today())return;
    const foto={}; ['clients','budgets','services','trainings','projects','leads','packages','recurring',
      'payments','expenses','tasks','events','docs','certificates','validities'].forEach(k=>foto[k]=S[k]||[]);
    foto.settings=S.settings;
    const {error}=await sb.from('hub_backups').insert({owner_id:ME.id,data:foto});
    if(error)throw error;
    S.settings.lastBackup=today();
    const {data}=await sb.from('hub_backups').select('id,created_at').order('created_at',{ascending:false});
    if(data&&data.length>7){
      const velhos=data.slice(7).map(x=>x.id);
      await sb.from('hub_backups').delete().in('id',velhos);
    }
  }catch(e){ console.warn('backup',e) }
}
async function restaurarBackup(){
  const {data,error}=await sb.from('hub_backups').select('id,created_at').order('created_at',{ascending:false});
  if(error||!data||!data.length){toast('Nenhum backup disponível ainda','err');return}
  modal({title:'Restaurar backup',body:`
    <p class="mut tiny" style="margin:0 0 12px">São guardadas as 7 cópias mais recentes, feitas automaticamente uma vez por dia. Restaurar substitui os dados atuais.</p>
    <label class="f">Cópia<select id="bk">${data.map(b=>`<option value="${b.id}">${new Date(b.created_at).toLocaleString('pt-BR')}</option>`).join('')}</select></label>`,
    footer:`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn d" id="bkok">Restaurar</button>`,
    onOpen:v=>{ v.querySelector('#bkok').onclick=async()=>{
      const id=v.querySelector('#bk').value;
      const {data:d2}=await sb.from('hub_backups').select('data').eq('id',id).single();
      if(!d2){toast('Falha ao ler o backup','err');return}
      Object.keys(d2.data).forEach(k=>{ S[k]=d2.data[k] });
      await pushAll(); closeModal(); toast('Backup restaurado'); router();
    }}});
}

/* =========================================================
   TAB E ENTER ENTRE OS CAMPOS
   ========================================================= */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const el=e.target;
  if(!el||!/^(INPUT|SELECT)$/.test(el.tagName))return;
  if(el.type==='checkbox'||el.type==='submit')return;
  const caixa=el.closest('.modal, #view'); if(!caixa)return;
  const campos=[...caixa.querySelectorAll('input:not([type=hidden]):not([disabled]), select, textarea')]
    .filter(x=>x.offsetParent!==null);
  const i=campos.indexOf(el);
  if(i>-1&&i<campos.length-1){ e.preventDefault(); campos[i+1].focus();
    if(campos[i+1].select)try{campos[i+1].select()}catch(_){}
  }
},true);
</script>

};
const isUUID=v=>typeof v==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v);
const DATECOL=/(_date|validity|next_charge|issue_date|end_date|done_date)$/;

function toRow(coll,o){
  const m=MAP[coll], r={id:isUUID(o.id)?o.id:crypto.randomUUID(), owner_id:ME.id};
  if(!isUUID(o.id))o.id=r.id;
  for(const k in m.f){
    const col=m.f[k]; let v=o[k];
    if(v===undefined)v=null;
    if(col.endsWith('_id')&&!isUUID(v))v=null;                 // FK vazia vira null
    if((DATECOL.test(col))&&(v===''||v==null))v=null;          // data vazia vira null
    if(col==='created_at'&&!v)continue;
    r[col]=v;
  }
  return r;
}
function fromRow(coll,r){
  const m=MAP[coll], o={id:r.id};
  for(const k in m.f){
    const col=m.f[k]; let v=r[col];
    if(v===null)v=(Array.isArray(o[k])?[]:'');
    if(col==='fav'||col==='recurrent')v=!!r[col];
    if(['items','content','versions','timeline'].includes(col))v=r[col]||[];
    if(typeof v==='string'&&/^\d{4}-\d{2}-\d{2}T/.test(v))v=v.slice(0,10);
    o[k]=v;
  }
  return o;
}

/* ---------- carregar tudo do banco ---------- */
const BASE={};
async function pullAll(){
  const out={};
  for(const coll in MAP){
    const {data,error}=await sb.from(MAP[coll].t).select('*').is('deleted_at',null).limit(5000);
    if(error)throw error;
    out[coll]=(data||[]).map(r=>fromRow(coll,r));
    BASE[coll]=new Set(out[coll].map(x=>x.id));   // referência do que existe no servidor
  }
  const {data:st}=await sb.from('hub_settings').select('data').maybeSingle();
  out.settings=st?.data||{};
  out.notif=[];
  return out;
}
/* ---------- gravar tudo no banco ---------- */
let syncT=null;
function save(){
  if(!SYNC.on)return;
  clearTimeout(syncT); SYNC.pending=true; paintSync();
  syncT=setTimeout(pushAll,900);
}
let ULTIMO={};
async function pushAll(forcar){
  if(!sb||!ME)return;
  try{
    for(const coll in MAP){
      const marca=JSON.stringify(S[coll]||[]);
      if(!forcar&&ULTIMO[coll]===marca) continue;   // nada mudou nesta tabela
      ULTIMO[coll]=marca;
      const rows=(S[coll]||[]).map(o=>toRow(coll,o));
      const atuais=new Set(rows.map(r=>r.id));
      const tabela=MAP[coll].t;

      // grava em blocos, para não estourar o tamanho da requisição
      for(let i=0;i<rows.length;i+=300){
        const bloco=rows.slice(i,i+300);
        const {error}=await sb.from(tabela).upsert(bloco,{onConflict:'id'});
        if(error)throw error;
      }
      // apaga apenas o que saiu, comparando com o que veio do servidor
      const antes=BASE[coll]||new Set();
      const removidos=[...antes].filter(id=>!atuais.has(id));
      for(let i=0;i<removidos.length;i+=100){
        const bloco=removidos.slice(i,i+100);
        const {error}=await sb.from(tabela).delete().eq('owner_id',ME.id).in('id',bloco);
        if(error)throw error;
      }
      BASE[coll]=atuais;
    }
    await sb.from('hub_settings').upsert({owner_id:ME.id,data:S.settings,updated_at:new Date().toISOString()},{onConflict:'owner_id'});
    SYNC.pending=false; SYNC.last=new Date(); paintSync();
  }catch(e){
    SYNC.pending=false; paintSync();
    console.error(e); toast('Falha ao salvar no servidor: '+(e.message||''),'err');
  }
}
function paintSync(){
  const el=document.getElementById('syncbadge'); if(!el)return;
  el.innerHTML=SYNC.pending?`<span class="tiny" style="color:var(--warn)">salvando…</span>`

}

    if(!em()||!pw()){setMsg('Informe e-mail e senha.');return}
    busy(true);
    const {error}=await sb.auth.signInWithPassword({email:em(),password:pw()});
    busy(false);
    // mensagem genérica: não revela se o e-mail existe
    if(error){setMsg('E-mail ou senha inválidos.');return}
    boot();
  };
  document.getElementById('lb').onclick=doLogin;
  document.getElementById('lp').onkeydown=e=>{if(e.key==='Enter')doLogin()};
}
function trocarBanner(){
  const st=S.settings; st.banners=st.banners||{};
  const nrs=Object.keys(NRT);
  modal({title:'Imagem de fundo do certificado',wide:true,body:`
    <label class="f">Norma<select id="bn_nr">${nrs.map(k=>`<option value="${k}">${k} — ${(st.banners&&st.banners[k])?'imagem própria':'padrão'}</option>`).join('')}</select></label>
    <div class="tiny mut" style="margin:12px 0">Envie uma imagem panorâmica (proporção aproximada de 3 por 1). Ela vira a faixa superior do certificado dessa norma.</div>
    <div class="row wrap" style="gap:8px">
      <button class="btn p" id="bn_up">${ic('up')}Enviar imagem</button>
      <button class="btn d" id="bn_rm">${ic('trash')}Voltar ao padrão</button>
    </div>`,
    footer:`<button class="btn" onclick="closeModal()">Fechar</button>`,
    onOpen:v=>{
      v.querySelector('#bn_up').onclick=()=>{
        const nr=v.querySelector('#bn_nr').value;
        const i=document.createElement('input'); i.type='file'; i.accept='image/jpeg,image/png';
        i.onchange=()=>{ const f=i.files[0]; if(!f)return;
          if(f.size>1.5*1024*1024){toast('Use uma imagem de até 1,5 MB','err');return}
          const r=new FileReader();
          r.onload=()=>{ S.settings.banners[nr]=r.result; save(); toast('Imagem aplicada à '+nr); closeModal(); };
          r.readAsDataURL(f); };
        i.click();
      };
      v.querySelector('#bn_rm').onclick=()=>{ const nr=v.querySelector('#bn_nr').value;
        delete S.settings.banners[nr]; save(); toast('Voltou ao padrão em '+nr); closeModal(); };
    }});
}
function trocarAssinatura(){
  const i=document.createElement('input'); i.type='file'; i.accept='image/png,image/jpeg';
  i.onchange=()=>{ const f=i.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ S.settings.signature=r.result; save(); toast('Assinatura atualizada'); };
    r.readAsDataURL(f); };
  i.click();
}
async function changePassword(){
  modal({title:'Alterar senha',body:`<div class="fgrid">
      <label class="f full">Senha atual<input type="password" id="pw0" autocomplete="current-password"></label>
      <label class="f">Nova senha<input type="password" id="pw1" autocomplete="new-password"></label>
      <label class="f">Repita a nova senha<input type="password" id="pw2" autocomplete="new-password"></label>
    </div><div class="tiny mut3" style="margin-top:10px">Mínimo de 8 caracteres. Você continua conectado depois da troca.</div>`,
    footer:`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn p" id="pwok">Alterar senha</button>`,
    onOpen:v=>{ v.querySelector('#pwok').onclick=async()=>{
      const a=v.querySelector('#pw0').value, b=v.querySelector('#pw1').value, c=v.querySelector('#pw2').value;
      if(b.length<8){toast('A nova senha precisa de ao menos 8 caracteres','err');return}
      if(b!==c){toast('As senhas não conferem','err');return}
      const check=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
      const {error:e1}=await check.auth.signInWithPassword({email:ME.email,password:a});
      if(e1){toast('Senha atual incorreta','err');return}
      const {error:e2}=await sb.auth.updateUser({password:b});
      if(e2){toast('Não foi possível alterar a senha','err');return}
      closeModal(); toast('Senha alterada com sucesso');
    }}});
}
async function addUser(){
  modal({title:'Adicionar usuário',body:`<div class="fgrid">
      <label class="f full">E-mail<input type="email" id="nu_e" autocomplete="off"></label>
      <label class="f full">Senha provisória<input type="password" id="nu_p" autocomplete="new-password"></label>
    </div>
    <div class="tiny mut" style="margin-top:12px;line-height:1.55">Atenção: hoje cada conta enxerga apenas os próprios registros — é o que impede alguém de acessar dados de outro usuário. O novo acesso entra em um sistema vazio, sem seus clientes e orçamentos. Para uma equipe compartilhar os mesmos dados, é preciso ativar o modo empresa.</div>`,
    footer:`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn p" id="nuok">Criar acesso</button>`,
    onOpen:v=>{ v.querySelector('#nuok').onclick=async()=>{
      const e=v.querySelector('#nu_e').value.trim(), p=v.querySelector('#nu_p').value;
      if(!e||p.length<8){toast('Informe e-mail válido e senha de 8+ caracteres','err');return}
      // cliente separado: criar o usuário não substitui a sua sessão
      const tmp=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
      const {error}=await tmp.auth.signUp({email:e,password:p});
      if(error){toast('Não foi possível criar o acesso','err');return}
      closeModal(); toast('Acesso criado para '+e);
    }}});
}
async function logout(){
  await sb.auth.signOut();          // revoga o refresh token no servidor
  S=null; ME=null; SYNC.on=false;
  location.hash='#/dashboard';
  loginScreen('');
}

/* ---------- inicialização ---------- */
async function boot(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){loginScreen();return}
  ME=user;
  const el=document.getElementById('login'); if(el)el.remove();
  document.getElementById('app').style.display='flex';
  S=await pullAll();
  for(const k in EMPTY) if(!S[k]) S[k]=[];
  if(!S.settings||!S.settings.company){ S.settings=seed().settings; S.settings.demo=false; }
  // só instala o catálogo UMA vez; depois disso, o que você apagar fica apagado
  const primeiraVez=!S.settings.installed && !S.clients.length && !S.services.length && !S.budgets.length;
  SYNC.on=true;
  if(primeiraVez){
    const d=seed();
    S.services=d.services.map(x=>({...x,id:crypto.randomUUID(),demo:false}));
    toast('Catálogo de serviços instalado na sua conta');
  }
  if(!S.settings.installed){ S.settings.installed=true; await pushAll(); }
  S.payments.forEach(p=>{if(p.status==='pendente'&&p.due&&p.due<today())p.status='atrasado'});
  S.recurring.forEach(r=>{if(r.status==='ativo'&&r.next&&r.next<today())r.status='atrasado'});
  backupDiario();
  stars(); paintBell();
  if(!location.hash)location.hash='#/dashboard';
  router(); paintSync();
}
/* importar backup JSON gerado na versão offline */
function importBackup(){
  const i=document.createElement('input');i.type='file';i.accept='application/json';
  i.onchange=async()=>{
    const f=i.files[0]; if(!f)return;
    try{
      const d=JSON.parse(await f.text());
      let n=0;
      for(const coll in MAP){ (d[coll]||[]).forEach(o=>{ o.id=crypto.randomUUID(); S[coll].push(o); n++ }) }
      if(d.settings)S.settings={...S.settings,...d.settings};
      await pushAll(); toast(n+' registros importados'); router();
    }catch(e){ toast('Arquivo inválido','err') }
  };
  i.click();
}
(async()=>{
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  boot();
})();
</script>
