        <p class="mut tiny" style="margin:4px 0 0">${esc(c.name)} · ${esc(c.city||'')} ${c.doc?'· '+esc(c.doc):''}</p></div>
      <span class="sp"></span>
      <button class="btn" onclick="wpp('${c.whatsapp}','Olá, ${esc(c.contact||'')}! Aqui é o Leonardo, da Protecwork.')">${ic('wpp')}WhatsApp</button>
      <button class="btn" onclick="editClient('${c.id}')">${ic('edit')}Editar</button>
      <button class="btn p" onclick="newBudget('${c.id}')">${ic('plus')}Novo orçamento</button>
      <div class="x" onclick="delClient('${c.id}')" style="color:var(--err)">${ic('trash')}</div>
    </div>
  </div>
  <div class="tabs" style="margin-bottom:16px">${T('geral','Visão geral')}${T('orcamentos','Orçamentos')}${T('servicos','Serviços')}${T('financeiro','Financeiro')}${T('documentos','Documentos')}</div>
  ${body}`;
};
function emptyBox(icon,t,d,btn=''){return `<div class="glass empty"><i>${ic(icon)}</i><h4>${esc(t)}</h4><p>${esc(d)}</p>${btn?`<div style="margin-top:10px">${btn}</div>`:''}</div>`}
</script>
<script>
/* =========================================================
   CENTRAL DE ORÇAMENTOS
   ========================================================= */
let BF={status:'',q:'',cat:'',client:'',min:'',max:'',from:'',to:'',flag:'',sort:'date',dir:-1,page:1};
const BPP=12;
function bstat(b){return BS[b.status]||BS.fazer}
function statusChip(b){const s=bstat(b);return `<span class="chip" style="color:${s.c}"><span class="b"></span>${s.l}</span>`}
function filteredBudgets(){
  let L=S.budgets.slice();
  if(BF.status)L=L.filter(b=>b.status===BF.status);
  if(BF.cat)L=L.filter(b=>b.type===BF.cat);
  if(BF.client)L=L.filter(b=>b.clientId===BF.client);
  if(BF.min)L=L.filter(b=>b.total>=+BF.min);
  if(BF.max)L=L.filter(b=>b.total<=+BF.max);
  if(BF.from)L=L.filter(b=>b.date>=BF.from);
  if(BF.to)L=L.filter(b=>b.date<=BF.to);
  if(BF.flag==='vencidos')L=L.filter(b=>b.validity<today()&&['enviado','negociacao','pronto'].includes(b.status));
  if(BF.flag==='vencendo')L=L.filter(b=>diffDays(b.validity,today())>=0&&diffDays(b.validity,today())<=5);
  if(BF.flag==='followup')L=L.filter(b=>b.status==='enviado'&&diffDays(today(),b.date)>=(S.settings.followupDays||3));
  if(BF.q){const q=BF.q.toLowerCase();L=L.filter(b=>(b.code+cname(b.clientId)+(b.items[0]?.desc||'')).toLowerCase().includes(q))}
  const k=BF.sort;
  L.sort((a,b)=>{
    let x=k==='client'?cname(a.clientId).localeCompare(cname(b.clientId)):k==='total'?a.total-b.total:String(a[k]).localeCompare(String(b[k]));
    return x*BF.dir;
  });
  return L;
}
function budgetTable(list){
  return `<div class="glass tbl-wrap"><table>
    <thead><tr>${[['code','Número'],['client','Cliente'],['type','Categoria'],['date','Data'],['validity','Validade'],['total','Valor'],['status','Status']]
      .map(([k,l])=>`<th onclick="sortB('${k}')">${l}${BF.sort===k?(BF.dir>0?' ↑':' ↓'):''}</th>`).join('')}<th>Próxima ação</th><th></th></tr></thead>
    <tbody>${list.map(b=>{
      const venc=b.validity<today()&&['enviado','negociacao','pronto'].includes(b.status);
      return `<tr class="card-row" onclick="go('orcamento/${b.id}')" style="cursor:pointer">
        <td class="mono td-code"><b>${esc(b.code)}</b>${b.versions?.length?`<span class="tiny mut3"> v${b.versions.length+1}</span>`:''}</td>
        <td class="td-client">${esc(cname(b.clientId))}</td>
        <td class="mut tiny" data-l="Categoria">${b.type==='site'?'Site':b.type==='outro'?'Outro':'Segurança do trabalho'}</td>
        <td class="mono" data-l="Data">${fmtD(b.date)}</td>
        <td class="mono" data-l="Validade" style="${venc?'color:var(--err)':''}">${fmtD(b.validity)}</td>
        <td class="mono td-total" data-l="Valor"><b>${money(b.total)}</b></td>
        <td data-l="Status">${statusChip(b)}</td>
        <td class="tiny mut" data-l="Próxima ação">${esc(b.nextAction||'—')}</td>
        <td class="td-acts" onclick="event.stopPropagation()"><div class="row" style="gap:5px">
          <button class="btn sm" title="PDF" onclick="genPDF('${b.id}')">${ic('pdf')}</button>
          <button class="btn sm" title="WhatsApp" onclick="sendWpp('${b.id}')">${ic('wpp')}</button>
          <button class="btn sm" title="Excluir" onclick="delBudget('${b.id}')">${ic('trash')}</button>
        </div></td></tr>`}).join('')}
    </tbody></table></div>`;
}
function sortB(k){ if(BF.sort===k)BF.dir*=-1; else{BF.sort=k;BF.dir=-1} router() }
function setBF(k,v){BF[k]=v;BF.page=1;router()}
function clearBF(){BF={...BF,status:'',q:'',cat:'',client:'',min:'',max:'',from:'',to:'',flag:'',page:1};router()}

ROUTES.orcamentos=()=>{
  const L=filteredBudgets();
  const pages=Math.max(1,Math.ceil(L.length/BPP));
  BF.page=Math.min(BF.page,pages);
  const view=L.slice((BF.page-1)*BPP,BF.page*BPP);
  const cnt=k=>{const l=S.budgets.filter(b=>b.status===k);return[l.length,l.reduce((s,b)=>s+b.total,0)]};
  return `
  <div class="page-h reveal">
    <div><h1>Central de Orçamentos</h1><p>Crie, acompanhe e transforme propostas em vendas.</p></div>
    <div class="row wrap" style="gap:8px">
      <button class="btn" onclick="importBudgetPDF()">${ic('up')}Importar PDF</button>
      <button class="btn p pulse" onclick="newBudget()">${ic('plus')}Novo orçamento</button>
    </div>
  </div>
  <div class="scroller" style="margin-bottom:12px">
    <button class="pill ${!BF.status?'on':''}" onclick="setBF('status','')">Todos <b>${S.budgets.length}</b></button>
    ${Object.entries(BS).map(([k,v])=>{const[n,t]=cnt(k);return `<button class="pill ${BF.status===k?'on':''}" onclick="setBF('status','${k}')">
      <span class="b" style="width:8px;height:8px;border-radius:50%;background:${v.c};display:inline-block"></span>${v.l} <b>${n}</b> <span class="mut3 tiny">${t?money(t):''}</span></button>`}).join('')}
  </div>
  <details class="glass filters" style="padding:13px;margin-bottom:14px" ${BF.q||BF.cat||BF.client||BF.flag||BF.min||BF.max||BF.from||BF.to?'open':''}>
    <summary class="row" style="cursor:pointer;list-style:none;gap:9px"><b style="font-size:14px">Filtros e busca</b>
      <span class="sp"></span><span class="tiny mut">${filteredBudgets().length} resultado(s)</span></summary>
    <div class="row wrap" style="gap:9px;margin-top:12px">
      <input style="width:220px" placeholder="Buscar número, cliente, serviço…" value="${esc(BF.q)}" oninput="BF.q=this.value;clearTimeout(window.__bt);window.__bt=setTimeout(router,280)">
      <select style="width:auto" onchange="setBF('cat',this.value)"><option value="">Todas as categorias</option>
        ${[['sst','Segurança do trabalho'],['site','Desenvolvimento de site'],['outro','Outro serviço']].map(([v,l])=>`<option value="${v}" ${BF.cat===v?'selected':''}>${l}</option>`).join('')}</select>
      <select style="width:auto" onchange="setBF('client',this.value)"><option value="">Todos os clientes</option>
        ${S.clients.map(c=>`<option value="${c.id}" ${BF.client===c.id?'selected':''}>${esc(c.fantasy||c.name)}</option>`).join('')}</select>
      <select style="width:auto" onchange="setBF('flag',this.value)"><option value="">Sem filtro de prazo</option>
        <option value="vencidos" ${BF.flag==='vencidos'?'selected':''}>Vencidos</option>
        <option value="vencendo" ${BF.flag==='vencendo'?'selected':''}>Vencem em 5 dias</option>
        <option value="followup" ${BF.flag==='followup'?'selected':''}>Precisam de follow-up</option></select>
      <input type="number" style="width:118px" placeholder="Valor mín." value="${BF.min}" onchange="setBF('min',this.value)">
      <input type="number" style="width:118px" placeholder="Valor máx." value="${BF.max}" onchange="setBF('max',this.value)">
      <input type="date" style="width:150px" value="${BF.from}" onchange="setBF('from',this.value)">
      <input type="date" style="width:150px" value="${BF.to}" onchange="setBF('to',this.value)">
      <button class="btn sm" onclick="clearBF()">Limpar</button>
      <span class="sp"></span><span class="tiny mut">${L.length} resultado(s) · ${money(L.reduce((s,b)=>s+b.total,0))}</span>
    </div>
  </details>
  ${view.length?budgetTable(view)+(pages>1?`<div class="row" style="justify-content:center;gap:8px;margin-top:14px">
    ${[...Array(pages)].map((_,i)=>`<button class="pill ${BF.page===i+1?'on':''}" onclick="BF.page=${i+1};router()">${i+1}</button>`).join('')}</div>`:'')
  :emptyBox('doc','Nenhum orçamento por aqui','Quando você criar seu primeiro orçamento, ele aparece nesta lista.',`<button class="btn p" onclick="newBudget()">${ic('plus')}Criar orçamento</button>`)}`;
};

/* ---------- fluxo em etapas ---------- */
let W=null;
function liveTotals(){
  if(!W)return; const t=budgetTotal(W);
  const set=(id,v)=>{const el=document.getElementById(id); if(el)el.textContent=v};
  set('t-sub',money(t.sub)); set('t-desc','− '+money(t.desc)); set('t-acr',money(t.acr));
  set('t-tax',money(t.tax)); set('t-tot',money(t.total));
  (W.items||[]).forEach((it,i)=>{const b=document.querySelector('[data-row="'+i+'"]');
    if(b)b.textContent=money(it.qty*it.price-(it.discount||0))});
}
function newBudget(clientId){
  W={step:0,type:'sst',clientId:clientId||'',items:[],discount:0,addition:0,taxes:0,scope:'',content:[],
     conditions:S.settings.conditions,notes:'',validityDays:S.settings.validity||15,editing:null,
     paymentTerms:S.settings.paymentTerms||'',execDeadline:S.settings.execDeadline||''};
  wizard();
}
function editBudget(id){
  const b=byId('budgets',id);
  W={step:2,type:b.type,clientId:b.clientId,items:JSON.parse(JSON.stringify(b.items)),discount:b.discount,addition:b.addition,
     taxes:b.taxes,scope:b.scope,content:(b.content||[]).slice(),conditions:b.conditions,notes:b.notes,
     validityDays:Math.max(1,diffDays(b.validity,b.date)),editing:id,
     paymentTerms:b.paymentTerms||'',execDeadline:b.execDeadline||''};
  wizard();
}
const WSTEPS=['Tipo','Cliente','Serviços','Valores','Conteúdo','Revisão'];
function wizard(){
  const st=W.step;
  let body='';
  if(st===0) body=`<p class="mut" style="margin:0 0 14px">Qual é a natureza deste orçamento?</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">
      ${[['sst','helmet','Segurança do Trabalho','Treinamentos, laudos e serviços técnicos'],
         ['site','globe','Desenvolvimento de Site','Sites, landing pages e sistemas'],
         ['outro','folder','Outro serviço','Consultorias e demandas avulsas']].map(([v,i,t,d])=>`
        <button class="btn" style="flex-direction:column;align-items:flex-start;gap:7px;padding:17px;height:auto;text-align:left;${W.type===v?'border-color:var(--g);background:rgba(0,200,83,.12)':''}"
          onclick="W.type='${v}';W.step=1;wizard()"><span style="color:var(--g2)">${ic(i)}</span><b>${t}</b><span class="tiny mut" style="font-weight:400">${d}</span></button>`).join('')}
    </div>`;
  if(st===1) body=`
    <label class="f">Cliente<select id="wcl">${['<option value="">Selecione um cliente…</option>',...S.clients.map(c=>`<option value="${c.id}" ${W.clientId===c.id?'selected':''}>${esc(c.fantasy||c.name)} — ${esc(c.city||'')}</option>`)].join('')}</select></label>
    <div style="margin-top:12px"><button class="btn" onclick="editClient(null,n=>{W.clientId=n.id;wizard()})">${ic('plus')}Cadastrar novo cliente</button></div>`;
  if(st===2){
    const cat=W.type==='site'?'site':W.type==='sst'?null:null;
    const svs=S.services.filter(s=>W.type==='site'?s.cat==='site':W.type==='sst'?s.cat!=='site':true);
    body=`<div class="row wrap" style="gap:9px;margin-bottom:12px">
      <select id="wsv" style="flex:1;min-width:220px">${svs.map(s=>`<option value="${s.id}">${esc(s.name)} — ${money(s.price)}/${s.unit}</option>`).join('')}</select>
      <button class="btn p" onclick="addItem()">${ic('plus')}Adicionar item</button></div>
      ${W.items.length?`<div class="tbl-wrap" style="border:1px solid rgba(255,255,255,.07)"><table><thead><tr><th>Item</th><th>Qtd</th><th>Unidade</th><th>Valor unit.</th><th>Desc.</th><th>Total</th><th></th></tr></thead><tbody>
        ${W.items.map((it,i)=>`<tr>
          <td data-l="Item"><input value="${esc(it.desc)}" oninput="W.items[${i}].desc=this.value" style="min-width:180px"></td>
          <td data-l="Qtd"><input type="number" inputmode="decimal" value="${it.qty}" min="0" step="any" style="width:80px" oninput="W.items[${i}].qty=+this.value||0;liveTotals()"></td>
          <td data-l="Unidade"><input value="${esc(it.unit)}" style="width:104px" oninput="W.items[${i}].unit=this.value"></td>
          <td data-l="Valor unit."><input type="number" inputmode="decimal" value="${it.price}" step="any" style="width:116px" oninput="W.items[${i}].price=+this.value||0;liveTotals()"></td>
          <td data-l="Desconto"><input type="number" inputmode="decimal" value="${it.discount||0}" step="any" style="width:100px" oninput="W.items[${i}].discount=+this.value||0;liveTotals()"></td>
          <td data-l="Total" class="mono"><b data-row="${i}">${money(it.qty*it.price-(it.discount||0))}</b></td>
          <td><div class="x" style="color:var(--err)" onclick="W.items.splice(${i},1);wizard()">${ic('trash')}</div></td></tr>`).join('')}
      </tbody></table></div>`:`<div class="empty" style="padding:30px"><i>${ic('bolt')}</i><h4>Nenhum item ainda</h4><p>Escolha um serviço do catálogo e adicione. Descrição, carga horária e preço vêm preenchidos.</p></div>`}`;
  }
  if(st===3){
    const t=budgetTotal(W);
    body=`<div class="fgrid">
      <label class="f">Desconto geral (R$)<input type="number" inputmode="decimal" step="any" value="${W.discount}" oninput="W.discount=+this.value||0;liveTotals()"></label>
      <label class="f">Acréscimo (R$)<input type="number" inputmode="decimal" step="any" value="${W.addition}" oninput="W.addition=+this.value||0;liveTotals()"></label>
      <label class="f">Impostos sobre o subtotal (%)<input type="number" inputmode="decimal" step="any" value="${W.taxes}" oninput="W.taxes=+this.value||0;liveTotals()"></label>
      <label class="f">Validade da proposta (dias)<input type="number" inputmode="numeric" value="${W.validityDays}" oninput="W.validityDays=+this.value||15"></label>
      <label class="f">Prazo de execução<input value="${esc(W.execDeadline||'')}" placeholder="Até 15 dias após aprovação" oninput="W.execDeadline=this.value"></label>
      <label class="f">Condições de pagamento<input value="${esc(W.paymentTerms||'')}" placeholder="50% na aprovação e 50% na entrega" oninput="W.paymentTerms=this.value"></label>
    </div>
    <div class="glass" style="padding:16px;margin-top:16px">
      <div class="calc"><span class="mut">Subtotal</span><b class="mono" id="t-sub">${money(t.sub)}</b></div>
      <div class="calc"><span class="mut">Desconto</span><b class="mono" id="t-desc">− ${money(t.desc)}</b></div>
      <div class="calc"><span class="mut">Acréscimos</span><b class="mono" id="t-acr">${money(t.acr)}</b></div>
      <div class="calc"><span class="mut">Impostos</span><b class="mono" id="t-tax">${money(t.tax)}</b></div>
      <div class="calc total"><span>Investimento total</span><span class="mono" id="t-tot">${money(t.total)}</span></div>
    </div>`;
  }
  if(st===4){
    if(!W.scope) autoContent();
    body=`<div class="row" style="margin-bottom:11px"><button class="btn sm" onclick="autoContent();wizard()">${ic('bolt')}Gerar conteúdo automaticamente</button></div>
      <label class="f">Escopo do serviço<textarea rows="7" oninput="W.scope=this.value">${esc(W.scope)}</textarea></label>
      <label class="f" style="margin-top:12px">Conteúdo programático (um tópico por linha)<textarea rows="7" oninput="W.content=this.value.split('\\n').filter(x=>x.trim())">${esc((W.content||[]).join('\n'))}</textarea></label>
      <label class="f" style="margin-top:12px">Condições comerciais<textarea rows="6" oninput="W.conditions=this.value">${esc(W.conditions)}</textarea></label>
      <label class="f" style="margin-top:12px">Observações<textarea rows="3" oninput="W.notes=this.value">${esc(W.notes)}</textarea></label>`;
  }
  if(st===5){
    const t=budgetTotal(W), c=byId('clients',W.clientId);
    body=`<div class="glass" style="padding:18px">
      <div class="row"><b style="font-size:17px">Proposta comercial</b><span class="sp"></span><span class="chip">${W.editing?byId('budgets',W.editing).code:'número gerado ao salvar'}</span></div>
      <div class="grid" style="gap:5px;margin-top:13px;font-size:13.6px">
        <div class="row"><span class="mut">Cliente</span><span class="sp"></span><b>${esc(c?(c.fantasy||c.name):'—')}</b></div>
        <div class="row"><span class="mut">Emissão</span><span class="sp"></span><b>${fmtD(today())}</b></div>
        <div class="row"><span class="mut">Validade</span><span class="sp"></span><b>${fmtD(addDays(today(),W.validityDays))}</b></div>
        <div class="row"><span class="mut">Itens</span><span class="sp"></span><b>${W.items.length}</b></div>
      </div>
      <div class="tbl-wrap" style="margin-top:14px;border:1px solid rgba(255,255,255,.07)"><table><thead><tr><th>Descrição</th><th>Qtd</th><th>Unit.</th><th>Total</th></tr></thead>
        <tbody>${W.items.map(i=>`<tr><td>${esc(i.desc)}</td><td>${i.qty} ${esc(i.unit)}</td><td class="mono">${money(i.price)}</td><td class="mono">${money(i.qty*i.price-(i.discount||0))}</td></tr>`).join('')}</tbody></table></div>
      <div class="calc total" style="margin-top:12px"><span>Investimento total</span><span class="mono">${money(t.total)}</span></div>
      <div class="tiny mut" style="white-space:pre-wrap;margin-top:14px">${esc(W.scope)}</div>
    </div>`;
  }
  modal({title:`Novo orçamento — ${WSTEPS[st]}`,wide:st>=2,
    body:`<div class="steps">${WSTEPS.map((_,i)=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>
      <div class="tiny mut3" style="margin-bottom:12px">Etapa ${st+1} de 6 · ${WSTEPS[st]}</div>${body}`,
    footer:`${st>0?`<button class="btn" onclick="W.step--;wizard()">${ic('back')}Voltar</button>`:''}
      <span class="sp"></span>
      ${st<5?`<button class="btn p" onclick="wnext()">Continuar</button>`
        :`<button class="btn" onclick="saveBudget('elaboracao')">Salvar rascunho</button>
          <button class="btn p" onclick="saveBudget('pronto')">${ic('check')}Gerar proposta</button>`}`,
    onOpen:v=>{
      const cl=v.querySelector('#wcl'); if(cl)cl.onchange=e=>W.clientId=e.target.value;
    }});
}
function wnext(){
  if(W.step===1){const el=$('#wcl'); if(el)W.clientId=el.value; if(!W.clientId){toast('Escolha ou cadastre um cliente','err');return}}
  if(W.step===2&&!W.items.length){toast('Adicione ao menos um serviço','err');return}
  if(W.step===3)autoContent();
  W.step++;wizard();
}
function addItem(){
  const id=$('#wsv').value, s=byId('services',id); if(!s)return;
  W.items.push({id:uid(),serviceId:s.id,desc:s.name,qty:1,unit:s.unit,price:s.price,discount:0});
  W.scope=''; wizard();
}
function autoContent(){
  const s=byId('services',W.items[0]?.serviceId);
  const qty=W.items[0]?.qty||1;
  W.scope=W.scope||buildScope(W,s,qty,S.settings);
  if(!W.content?.length&&s?.content?.length)W.content=s.content.slice();
  if(!W.conditions)W.conditions=S.settings.conditions;
}
function saveBudget(status){
  if(!W.clientId||!W.items.length){toast('Faltam cliente ou itens','err');return}
  const t=budgetTotal(W);
  if(W.editing){
    const b=byId('budgets',W.editing);
    (b.versions=b.versions||[]).push({v:(b.versions.length+1),total:b.total,items:b.items,at:new Date().toISOString()});
    Object.assign(b,{type:W.type,clientId:W.clientId,items:W.items,discount:W.discount,addition:W.addition,taxes:W.taxes,
      scope:W.scope,content:W.content,conditions:W.conditions,notes:W.notes,total:t.total,status,
      paymentTerms:W.paymentTerms,execDeadline:W.execDeadline,validity:addDays(b.date,W.validityDays)});
    log(b,`Nova versão criada (v${b.versions.length+1}) · ${money(t.total)}`);
    save();closeModal();toast('Versão v'+(b.versions.length+1)+' salva');go('orcamento/'+b.id);return;
  }
  const b={id:uid(),code:nextCode(),type:W.type,clientId:W.clientId,date:today(),validity:addDays(today(),W.validityDays),
    items:W.items,discount:W.discount,addition:W.addition,taxes:W.taxes,scope:W.scope,content:W.content,
    conditions:W.conditions,notes:W.notes,status,total:t.total,paymentTerms:W.paymentTerms,execDeadline:W.execDeadline,owner:'Leonardo',nextAction:'',nextActionDate:'',versions:[],timeline:[]};
  log(b,'Orçamento criado');
  if(status==='pronto')log(b,'Proposta gerada e pronta para envio');
  S.budgets.unshift(b);save();closeModal();
  toast('Orçamento '+b.code+' criado');
  notify('Novo orçamento '+b.code,cname(b.clientId)+' · '+money(b.total));
  go('orcamento/'+b.id);
}

/* ---------- detalhe do orçamento ---------- */
ROUTES.orcamento=(id)=>{
  const b=byId('budgets',id); if(!b)return ROUTES.orcamentos();
  const t=budgetTotal(b), c=byId('clients',b.clientId);
  const venc=b.validity<today()&&['enviado','negociacao','pronto'].includes(b.status);
  return `
  <div class="row" style="margin-bottom:14px"><button class="btn sm" onclick="go('orcamentos')">${ic('back')}Orçamentos</button></div>
  <div class="glass reveal" style="padding:20px;margin-bottom:16px">
    <div class="row wrap" style="gap:12px">
      <div><h1 style="font-size:24px">${esc(b.code)}</h1>
        <p class="mut tiny" style="margin:5px 0 0">${esc(cname(b.clientId))} · emitido em ${fmtD(b.date)} · válido até <b style="${venc?'color:var(--err)':''}">${fmtD(b.validity)}</b>${venc?' (vencido)':''}</p></div>
      <span class="sp"></span>${statusChip(b)}
      <div class="mono" style="font-size:23px;font-weight:700;color:var(--g2)">${money(b.total)}</div>
    </div>
    <div class="row wrap" style="gap:8px;margin-top:16px">
      <button class="btn p" onclick="genPDF('${b.id}')">${ic('pdf')}Gerar PDF</button>
      <button class="btn" onclick="sendWpp('${b.id}')">${ic('wpp')}Enviar por WhatsApp</button>
      <button class="btn" onclick="editBudget('${b.id}')">${ic('edit')}Nova versão</button>
      <button class="btn" onclick="dupBudget('${b.id}')">${ic('copy')}Duplicar</button>
      <button class="btn" onclick="window.print()">${ic('eye')}Imprimir</button>
      <select style="width:auto" onchange="setStatus('${b.id}',this.value)">
        ${Object.entries(BS).map(([k,v])=>`<option value="${k}" ${b.status===k?'selected':''}>${v.l}</option>`).join('')}</select>
      <button class="btn" onclick="addNote('${b.id}')">${ic('edit')}Nota</button>
      <span class="sp"></span>
      <div class="x" style="color:var(--err)" onclick="delBudget('${b.id}')">${ic('trash')}</div>
    </div>
  </div>

  <div class="grid" style="grid-template-columns:1.55fr 1fr">
    <div class="grid">
      <div class="glass" style="padding:18px">
        <h3 style="font-size:16px">Composição do investimento</h3>
        <div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>Descrição</th><th>Qtd</th><th>Unidade</th><th>Valor unit.</th><th>Desconto</th><th>Total</th></tr></thead>
          <tbody>${b.items.map(i=>`<tr><td>${esc(i.desc)}</td><td class="mono">${i.qty}</td><td class="mut">${esc(i.unit)}</td>
            <td class="mono">${money(i.price)}</td><td class="mono">${i.discount?'− '+money(i.discount):'—'}</td>
            <td class="mono"><b>${money(i.qty*i.price-(i.discount||0))}</b></td></tr>`).join('')}</tbody></table></div>
        <div style="margin-top:14px">
          <div class="calc"><span class="mut">Subtotal</span><b class="mono">${money(t.sub)}</b></div>
          ${t.desc?`<div class="calc"><span class="mut">Desconto</span><b class="mono">− ${money(t.desc)}</b></div>`:''}
          ${t.acr?`<div class="calc"><span class="mut">Acréscimos</span><b class="mono">${money(t.acr)}</b></div>`:''}
          ${t.tax?`<div class="calc"><span class="mut">Impostos</span><b class="mono">${money(t.tax)}</b></div>`:''}
          <div class="calc total"><span>Investimento total</span><span class="mono">${money(t.total)}</span></div>
        </div>
      </div>
      <div class="glass" style="padding:18px">
        <h3 style="font-size:16px">Escopo</h3>
        <p class="mut" style="white-space:pre-wrap;font-size:14px;margin:11px 0 0">${esc(b.scope||'—')}</p>
        ${b.content?.length?`<h3 style="font-size:16px;margin-top:18px">Conteúdo programático</h3>
          <ul class="mut" style="font-size:14px;margin:10px 0 0;padding-left:19px;line-height:1.75">${b.content.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
        ${b.paymentTerms?`<h3 style="font-size:16px;margin-top:18px">Condições de pagamento</h3><p class="mut" style="font-size:14px;margin:9px 0 0">${esc(b.paymentTerms)}</p>`:''}
        ${b.execDeadline?`<h3 style="font-size:16px;margin-top:18px">Prazo de execução</h3><p class="mut" style="font-size:14px;margin:9px 0 0">${esc(b.execDeadline)}</p>`:''}
        <h3 style="font-size:16px;margin-top:18px">Condições comerciais</h3>
        <p class="mut" style="white-space:pre-wrap;font-size:14px;margin:10px 0 0">${esc(b.conditions||'—')}</p>
      </div>
    </div>
    <div class="grid">
      <div class="glass" style="padding:18px">
        <h3 style="font-size:16px">Cliente</h3>
        <div class="grid" style="gap:6px;margin-top:11px;font-size:13.6px">
          ${[['Empresa',c?.name],['Responsável',c?.contact],['Telefone',c?.phone],['E-mail',c?.email],['Cidade',c?.city]]
            .map(([l,v])=>`<div class="row"><span class="mut">${l}</span><span class="sp"></span><b style="text-align:right">${esc(v||'—')}</b></div>`).join('')}
        </div>
        <button class="btn sm" style="margin-top:12px" onclick="go('cliente/${b.clientId}')">${ic('eye')}Abrir ficha</button>
      </div>
      <div class="glass" style="padding:18px">
        <div class="row"><h3 style="font-size:16px">Próxima ação</h3></div>
        <label class="f" style="margin-top:10px">O que fazer<input value="${esc(b.nextAction||'')}" onchange="byId('budgets','${b.id}').nextAction=this.value;save();toast('Próxima ação salva')"></label>
        <label class="f" style="margin-top:10px">Quando<input type="date" value="${b.nextActionDate||''}" onchange="byId('budgets','${b.id}').nextActionDate=this.value;save()"></label>
        <button class="btn sm" style="margin-top:11px" onclick="taskFromBudget('${b.id}')">${ic('check')}Criar tarefa de follow-up</button>
      </div>
      ${b.versions?.length?`<div class="glass" style="padding:18px"><h3 style="font-size:16px">Versões</h3>
        <div class="grid" style="gap:7px;margin-top:11px">
          ${b.versions.map(v=>`<div class="row tiny"><span class="mut">v${v.v}</span><span class="sp"></span><b class="mono">${money(v.total)}</b></div>`).join('')}
          <div class="row tiny"><span class="mut">v${b.versions.length+1} (atual)</span><span class="sp"></span><b class="mono up">${money(b.total)}</b></div>
        </div></div>`:''}
      <div class="glass" style="padding:18px">
        <h3 style="font-size:16px">Histórico</h3>
        <div class="tl" style="margin-top:13px">${(b.timeline||[]).map(x=>`<div class="it"><b>${esc(x.t)}</b>
          <span>${new Date(x.at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span></div>`).join('')||'<span class="tiny mut">Sem registros.</span>'}</div>
      </div>
    </div>
  </div>`;
};
function setStatus(id,st){
  const b=byId('budgets',id), old=b.status; if(old===st)return;
  b.status=st; log(b,`Status alterado de ${BS[old].l} para ${BS[st].l}`);
  if(st==='enviado'){b.sentAt=today();b.nextAction=b.nextAction||'Follow-up da proposta';b.nextActionDate=addDays(today(),S.settings.followupDays||3)}
  save();toast('Status atualizado para '+BS[st].l);
  if(st==='aprovado'){ log(b,'Cliente aprovou a proposta'); notify('Proposta aprovada 🎉',b.code+' · '+money(b.total)); afterApprove(b); }
  else router();
}
function afterApprove(b){
  modal({title:'Proposta aprovada 🎉',body:`<p class="mut" style="margin:0 0 14px">O que você quer gerar a partir de ${esc(b.code)} (${money(b.total)})?</p>
    <div class="grid">
      <button class="btn" id="a1" style="justify-content:flex-start;padding:14px">${ic('money')}Criar receita a receber</button>
      ${b.type==='sst'?`<button class="btn" id="a2" style="justify-content:flex-start;padding:14px">${ic('helmet')}Agendar treinamento</button>
      <button class="btn" id="a3" style="justify-content:flex-start;padding:14px">${ic('folder')}Abrir projeto técnico</button>`:
      `<button class="btn" id="a4" style="justify-content:flex-start;padding:14px">${ic('globe')}Criar receita recorrente (manutenção)</button>`}
    </div>`,
    footer:`<button class="btn" onclick="closeModal();router()">Agora não</button>`,
    onOpen:v=>{
      v.querySelector('#a1')&&(v.querySelector('#a1').onclick=()=>{closeModal();editPayment(null,b.clientId,{value:b.total,origin:b.code,desc:b.items[0]?.desc||'Serviço contratado'})});
      v.querySelector('#a2')&&(v.querySelector('#a2').onclick=()=>{closeModal();editTraining(null,{clientId:b.clientId,serviceId:b.items[0]?.serviceId,participants:b.items[0]?.qty,value:b.total,budgetId:b.id})});
      v.querySelector('#a3')&&(v.querySelector('#a3').onclick=()=>{closeModal();editProject(null,{clientId:b.clientId,name:b.items[0]?.desc,value:b.total})});
      v.querySelector('#a4')&&(v.querySelector('#a4').onclick=()=>{closeModal();editRecurring(null,{clientId:b.clientId,service:'Manutenção mensal — site',value:150})});
    }});
}
function delBudget(id){const b=byId('budgets',id);confirmDel('Excluir o orçamento '+b.code+'?',()=>{
  if(typeof paraLixeira==='function')paraLixeira('budgets',b,b.code);
  S.budgets=S.budgets.filter(x=>x.id!==id);save();toast('Excluído — fica 30 dias na lixeira');go('orcamentos')})}
function dupBudget(id){
  const o=byId('budgets',id);
  const b=JSON.parse(JSON.stringify(o));
  b.id=uid();b.code=nextCode();b.date=today();b.validity=addDays(today(),S.settings.validity||15);
  b.status='elaboracao';b.versions=[];b.timeline=[];log(b,'Duplicado a partir de '+o.code);
  S.budgets.unshift(b);save();toast('Orçamento duplicado: '+b.code);go('orcamento/'+b.id);
}
function addNote(id){
  const b=byId('budgets',id);
  openForm({title:'Registrar nota',fields:[{k:'t',l:'O que aconteceu?',t:'textarea',w:'full',req:true,ph:'Cliente pediu desconto. Retornar na sexta.'}],
    onSave:d=>{log(b,d.t,'nota');toast('Nota registrada');router()}});
}
function taskFromBudget(id){
  const b=byId('budgets',id);
  editTask(null,{title:'Follow-up · '+b.code+' — '+cname(b.clientId),clientId:b.clientId,budgetId:b.id,
    date:b.nextActionDate||addDays(today(),S.settings.followupDays||3),priority:'alta'});
}
function sendWpp(id){
  const b=byId('budgets',id), c=byId('clients',b.clientId);
  const msg=`Olá, ${c?.contact||''}! Aqui é o Leonardo, da Protecwork. Conforme conversamos, sua proposta ${b.code} está pronta: ${b.items[0]?.desc||''}. O investimento total é de ${money(b.total)}, com validade até ${fmtD(b.validity)}. Posso esclarecer qualquer ponto.`;
  modal({title:'Enviar por WhatsApp',body:`<label class="f">Mensagem<textarea id="wm" rows="6">${esc(msg)}</textarea></label>`,
    footer:`<button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('wm').value);toast('Mensagem copiada')">${ic('copy')}Copiar</button>
      <button class="btn p" id="wgo">${ic('wpp')}Abrir conversa</button>`,
    onOpen:v=>{v.querySelector('#wgo').onclick=()=>{
      wpp(c?.whatsapp,v.querySelector('#wm').value);
      if(b.status==='pronto'||b.status==='fazer'||b.status==='elaboracao'){b.status='enviado';log(b,'Proposta enviada ao cliente por WhatsApp');
        b.nextAction='Follow-up da proposta';b.nextActionDate=addDays(today(),S.settings.followupDays||3);save()}
      closeModal();router();
    };}});
}

/* ---------- PDF real (jsPDF + autotable) ---------- */
let pdfReady=null;
function loadPDF(){
  if(pdfReady)return pdfReady;
  pdfReady=new Promise((res,rej)=>{
    const a=document.createElement('script');a.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    a.onload=()=>{const b=document.createElement('script');b.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js';
      b.onload=res;b.onerror=rej;document.head.appendChild(b)};
    a.onerror=rej;document.head.appendChild(a);
  });
  return pdfReady;
}
async function genPDF(id){
  const b=byId('budgets',id);
  toast('Montando o PDF…','info');
  try{ await loadPDF(); }catch(e){ toast('Não foi possível carregar o gerador de PDF','err'); return; }
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const st=S.settings, c=byId('clients',b.clientId), t=budgetTotal(b);
  const W_=210, M=16; let y=0;
  const G=[0,200,83], DK=[24,32,27];

  const header=()=>{
    doc.setFillColor(9,13,11);doc.rect(0,0,W_,32,'F');
    doc.setFillColor(...G);doc.rect(0,32,W_,1.4,'F');
    doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(15);
    doc.text(st.fantasy||'Protecwork',M,15);
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(180,190,185);
    doc.text(st.company||'',M,20.5);
    doc.text(`CNPJ ${st.cnpj||''}  •  ${st.phone||''}  •  ${st.email||''}`,M,25);
    doc.setTextColor(...G);doc.setFont('helvetica','bold');doc.setFontSize(10);
    doc.text('PROPOSTA COMERCIAL',W_-M,15,{align:'right'});
    doc.setTextColor(230);doc.setFont('helvetica','normal');doc.setFontSize(8.5);
    doc.text(b.code,W_-M,20.5,{align:'right'});
    doc.text(`Emissão ${fmtD(b.date)}  •  Validade ${fmtD(b.validity)}`,W_-M,25,{align:'right'});
  };
  const footer=()=>{
    const p=doc.internal.getNumberOfPages();
    for(let i=1;i<=p;i++){
      doc.setPage(i);
      doc.setDrawColor(220);doc.line(M,283,W_-M,283);
      doc.setFontSize(7.6);doc.setTextColor(130);
      doc.text(`${st.company||''} • ${st.address||''} • ${st.site||''}`,M,288);
      doc.text(`${b.code}  —  página ${i} de ${p}`,W_-M,288,{align:'right'});
    }
  };
  header(); y=44;
  doc.setTextColor(30);doc.setFont('helvetica','bold');doc.setFontSize(11);
  doc.text('Dados do cliente',M,y);y+=2;
  doc.autoTable({startY:y+2,margin:{left:M,right:M},theme:'plain',styles:{fontSize:9,cellPadding:1.6,textColor:[40,40,40]},
    columnStyles:{0:{fontStyle:'bold',cellWidth:34,textColor:[110,110,110]},2:{fontStyle:'bold',cellWidth:30,textColor:[110,110,110]}},
    body:[['Empresa',c?.name||'—','Responsável',c?.contact||'—'],
          ['CNPJ/CPF',c?.doc||'—','Contato',(c?.phone||'')+(c?.email?' · '+c.email:'')],
          ['Cidade',(c?.city||'')+(c?.state?' — '+c.state:''),'Modalidade',b.type==='site'?'Projeto digital':'Presencial / in company']]});
  y=doc.lastAutoTable.finalY+9;

  const block=(title,text)=>{
    if(!text)return;
    if(y>250){doc.addPage();header();y=44}
    doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(...DK);doc.text(title,M,y);y+=5.5;
    doc.setFont('helvetica','normal');doc.setFontSize(9.4);doc.setTextColor(55);
    const lines=doc.splitTextToSize(text,W_-M*2);
    lines.forEach(l=>{ if(y>272){doc.addPage();header();y=44} doc.text(l,M,y); y+=4.7; });
    y+=5;
  };
  block('Escopo do serviço',b.scope);
  if(b.content?.length){
    if(y>245){doc.addPage();header();y=44}
    doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(...DK);doc.text('Conteúdo programático',M,y);y+=5.5;
    doc.setFont('helvetica','normal');doc.setFontSize(9.4);doc.setTextColor(55);
    b.content.forEach(it=>{
      const ls=doc.splitTextToSize('•  '+it,W_-M*2-4);
      ls.forEach(l=>{ if(y>272){doc.addPage();header();y=44} doc.text(l,M+2,y); y+=4.7; });
    });
    y+=6;
  }
  if(y>225){doc.addPage();header();y=44}
  doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(...DK);doc.text('Composição do investimento',M,y);
  doc.autoTable({startY:y+3,margin:{left:M,right:M},
    head:[['Descrição','Qtd','Unidade','Valor unit.','Desconto','Total']],
    body:b.items.map(i=>[i.desc,String(i.qty),i.unit,money(i.price),i.discount?'- '+money(i.discount):'—',money(i.qty*i.price-(i.discount||0))]),
    headStyles:{fillColor:[17,23,20],textColor:[255,255,255],fontSize:9},
    styles:{fontSize:9,cellPadding:2.4,overflow:'linebreak'},
    columnStyles:{0:{cellWidth:70},1:{halign:'right',cellWidth:14},3:{halign:'right'},4:{halign:'right'},5:{halign:'right',fontStyle:'bold'}},
    alternateRowStyles:{fillColor:[246,248,247]},
    didDrawPage:()=>{}});
  y=doc.lastAutoTable.finalY+4;
  const tot=[['Subtotal',money(t.sub)]];
  if(t.desc)tot.push(['Desconto','- '+money(t.desc)]);
  if(t.acr)tot.push(['Acréscimos',money(t.acr)]);
  if(t.tax)tot.push(['Impostos',money(t.tax)]);
  doc.autoTable({startY:y,margin:{left:W_-M-80,right:M},theme:'plain',styles:{fontSize:9.4,cellPadding:1.6},
    columnStyles:{0:{textColor:[110,110,110]},1:{halign:'right',fontStyle:'bold'}},body:tot});
  y=doc.lastAutoTable.finalY+3;
  doc.setFillColor(...G);doc.roundedRect(W_-M-80,y,80,12,2.5,2.5,'F');
  doc.setTextColor(4,21,12);doc.setFont('helvetica','bold');doc.setFontSize(9.5);
  doc.text('INVESTIMENTO TOTAL',W_-M-76,y+5);doc.setFontSize(12);doc.text(money(t.total),W_-M-4,y+9.6,{align:'right'});
  y+=20;
  if(b.paymentTerms) block('Condições de pagamento',b.paymentTerms);
  if(b.execDeadline) block('Prazo de execução',b.execDeadline);
  block('Condições comerciais',b.conditions);
  block('Observações',b.notes);
  block('Informações adicionais',`Proposta ${b.code} emitida em ${fmtD(b.date)}, válida até ${fmtD(b.validity)}. ${st.company||''} — CNPJ ${st.cnpj||''}. Dúvidas: ${st.phone||''} · ${st.email||''}.`);
  footer();

  const fname=`${b.code}-${(cname(b.clientId)||'cliente').replace(/[^\w]+/g,'-')}.pdf`;
  try{ doc.save(fname); }catch(e){ window.open(doc.output('bloburl'),'_blank'); }
  log(b,'PDF gerado');
  if(b.status==='fazer'||b.status==='elaboracao'){b.status='pronto';log(b,'Proposta pronta para envio')}
  save();toast('PDF gerado: '+fname);router();
}
</script>
<script>
/* =========================================================
   SEGURANÇA DO TRABALHO — catálogo, treinamentos, projetos
   ========================================================= */
function editService(id){
  const s=id?byId('services',id):null;
  openForm({del:s&&{coll:'services',id:s.id,label:s.name},title:s?'Editar serviço':'Novo serviço do catálogo',wide:true,values:s||{cat:'nr',unit:'participante'},
    fields:[{k:'name',l:'Nome do serviço',req:true,w:'full'},
      {k:'cat',l:'Categoria',t:'select',o:[['nr','Treinamento (NR)'],['tec','Serviço técnico'],['site','Site / digital']]},
      {k:'nr',l:'NR relacionada',ph:'NR-35'},{k:'hours',l:'Carga horária (h)',t:'number'},
      {k:'price',l:'Preço sugerido (R$)',t:'number',req:true},
      {k:'unit',l:'Unidade de cobrança',t:'select',o:['participante','projeto','máquina','funcionário','empresa','hora','diária','valor fechado']},
      {k:'desc',l:'Descrição padrão',t:'textarea',w:'full'},
      {k:'contentTxt',l:'Conteúdo programático (um por linha)',t:'textarea',rows:6,w:'full'}],
    onSave:d=>{
      const content=d.contentTxt.split('\n').map(x=>x.trim()).filter(Boolean);
      if(s)Object.assign(s,d,{content});else S.services.unshift({id:uid(),...d,content});
      toast('Catálogo atualizado');router();
    }});
}
if(true){ // injeta contentTxt ao abrir edição
  const _es=editService;
  editService=function(id){ const s=id?byId('services',id):null; if(s)s.contentTxt=(s.content||[]).join('\n'); _es(id); };
}
function editTraining(id,pre={}){
  const t=id?byId('trainings',id):null;
  openForm({del:t&&{coll:'trainings',id:t.id,label:'esta turma'},title:t?'Editar treinamento':'Novo treinamento',wide:true,values:t||{date:pre.date||today(),time:'08:00',status:'agendado',instructor:'Leonardo Santos',...pre},
    fields:[{k:'clientId',l:'Cliente',t:'select',req:true,o:S.clients.map(c=>[c.id,c.fantasy||c.name])},
      {k:'serviceId',l:'Treinamento',t:'select',req:true,o:S.services.filter(s=>s.cat==='nr').map(s=>[s.id,s.name])},
      {k:'participants',l:'Participantes',t:'number'},{k:'hours',l:'Carga horária (h)',t:'number'},
      {k:'date',l:'Data',t:'date'},{k:'time',l:'Horário',t:'time'},
      {k:'place',l:'Local',w:'full'},{k:'instructor',l:'Instrutor'},
      {k:'value',l:'Valor (R$)',t:'number'},{k:'cost',l:'Custo estimado (R$)',t:'number'},
      {k:'status',l:'Status',t:'select',o:TSTATUS.map(s=>[s,cap(s.replace('_',' '))])},
      {k:'notes',l:'Observações',t:'textarea',w:'full'}],
    onSave:d=>{
      if(t)Object.assign(t,d);
      else{const n={id:uid(),...d};S.trainings.unshift(n);
        S.events.unshift({id:uid(),title:sname(d.serviceId)+' — '+cname(d.clientId),type:'treinamento',date:d.date,time:d.time,clientId:d.clientId});}
      toast('Treinamento salvo');router();

  const B=S.budgets, ap=B.filter(b=>b.status==='aprovado'), rec=B.filter(b=>b.status==='recusado');
  const fin=ap.length+rec.length, conv=fin?Math.round(ap.length/fin*100):0;
  const ticket=ap.length?ap.reduce((s,b)=>s+b.total,0)/ap.length:0;
  const tempo=ap.length?Math.round(ap.reduce((s,b)=>s+Math.max(0,diffDays(today(),b.date)),0)/ap.length):0;
  const porServ={};
  ap.forEach(b=>b.items.forEach(i=>{porServ[i.desc]=(porServ[i.desc]||0)+(i.qty*i.price-(i.discount||0))}));
  const top=Object.entries(porServ).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const porCli={};ap.forEach(b=>porCli[cname(b.clientId)]=(porCli[cname(b.clientId)]||0)+b.total);
  const cores=['#39FF88','#3B82F6','#FFB020','#F472B6','#A78BFA','#22D3EE'];
  const cat={'Segurança do trabalho':0,'Sites':0,'Outros':0};
  ap.forEach(b=>cat[b.type==='sst'?'Segurança do trabalho':b.type==='site'?'Sites':'Outros']+=b.total);
  const card=(l,v,s)=>`<div class="glass kpi"><div class="lab">${l}</div><div class="val">${v}</div><div class="sub">${s}</div></div>`;
  return `<div class="page-h reveal"><div><h1>Relatórios</h1><p>Como o comercial está performando — por número, não por sensação.</p></div></div>
  <div class="sec-t" style="margin-top:0">Comercial</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
    ${card('Total negociado',money(B.reduce((s,b)=>s+b.total,0)),B.length+' propostas')}
    ${card('Total aprovado',money(ap.reduce((s,b)=>s+b.total,0)),ap.length+' fechamentos')}
    ${card('Total perdido',money(rec.reduce((s,b)=>s+b.total,0)),rec.length+' recusas')}
    ${card('Taxa de conversão',conv+'%',ap.length+' de '+fin)}
    ${card('Ticket médio',money(ticket),'por proposta aprovada')}
    ${card('Ciclo médio',tempo+' dias','da emissão ao fechamento')}
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:14px">
    <div class="glass" style="padding:18px"><h3 style="font-size:16px">Receita por categoria</h3>
      <div style="margin-top:14px">${donut(Object.entries(cat).map(([l,v],i)=>({l,v,c:cores[i]})))}</div></div>
    <div class="glass" style="padding:18px"><h3 style="font-size:16px">Serviços mais vendidos</h3>
      <div style="margin-top:14px">${top.length?funnelChart(top.map(([l,v],i)=>({l,v,n:'',c:cores[i%cores.length]}))):'<span class="tiny mut">Sem aprovações ainda.</span>'}</div></div>
    <div class="glass" style="padding:18px"><h3 style="font-size:16px">Clientes mais rentáveis</h3>
      <div style="margin-top:14px">${Object.keys(porCli).length?funnelChart(Object.entries(porCli).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([l,v],i)=>({l,v,n:'',c:cores[i%cores.length]}))):'<span class="tiny mut">Sem dados.</span>'}</div></div>
  </div>
`;
};

/* =========================================================
   BOOT
   ========================================================= */
function stars(){
  const c=$('#stars'),x=c.getContext('2d');
  const mob=innerWidth<880;let pts=[];
  const res=()=>{c.width=innerWidth;c.height=innerHeight;
    pts=[...Array(mob?34:90)].map(()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+.35,
      vx:(Math.random()-.5)*.12,vy:(Math.random()-.5)*.12,a:Math.random()*.55+.15}))};
  res();addEventListener('resize',res);
  const loop=()=>{
    x.clearRect(0,0,c.width,c.height);
    pts.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=c.width;if(p.x>c.width)p.x=0;if(p.y<0)p.y=c.height;if(p.y>c.height)p.y=0;
      x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle=`rgba(57,255,136,${p.a})`;x.fill();
      if(!mob)for(let j=i+1;j<pts.length;j++){const q=pts[j],d=Math.hypot(p.x-q.x,p.y-q.y);
        if(d<118){x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.strokeStyle=`rgba(0,200,83,${(1-d/118)*.13})`;x.stroke()}}});
    requestAnimationFrame(loop);
  };
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches)loop();
}
(async()=>{
  await load();
  // automações: marcar vencidos e pagamentos atrasados
  S.budgets.forEach(b=>{ if(b.validity<today()&&['enviado','negociacao','pronto'].includes(b.status)&&!b.vencAviso){b.vencAviso=true} });
  S.payments.forEach(p=>{ if(p.status==='pendente'&&p.due<today())p.status='atrasado' });
  S.recurring.forEach(r=>{ if(r.status==='ativo'&&r.next<today())r.status='atrasado' });
  save();
  backupDiario();
  stars(); paintBell();
  if(!location.hash)location.hash='#/dashboard';
  router();
})();
</script>

<script>

function paintClock(){

  if(m) m.textContent = st.msgOn===false?'' : (st.headerMsg?st.headerMsg.replace(/\{saudacao\}/gi,greeting()):greeting()+', Leonardo!');

/* =========================================================
   AGENDA — categorias, visões dia/semana/mês
   ========================================================= */
const CATS={treinamento:{l:'Treinamento',c:'#39FF88'},inspecao:{l:'Inspeção',c:'#3B82F6'},
  visita:{l:'Visita técnica',c:'#FB923C'},reuniao:{l:'Reunião',c:'#A78BFA'},prazo:{l:'Prazo',c:'#FF6B6B'},followup:{l:'Follow-up',c:'#22D3EE'}};
const catOf=t=>CATS[t]||CATS.reuniao;
let AG={view:'mes',sel:today()};
function agSet(k,v){AG[k]=v;router()}
function agShift(n){
  if(AG.view==='mes'){const d=new Date(AG.sel+'T12:00:00');d.setMonth(d.getMonth()+n);AG.sel=d.toISOString().slice(0,10)}
  else AG.sel=addDays(AG.sel,AG.view==='semana'?7*n:n);
  router();
}
function dayEvents(iso){
  const L=[...S.events.filter(e=>e.date===iso).map(e=>({...e,_k:'event'})),
    ...S.trainings.filter(t=>t.date===iso).map(t=>({id:t.id,title:sname(t.serviceId)+' — '+cname(t.clientId),type:'treinamento',
      time:t.time,place:t.place,clientId:t.clientId,_k:'training'})),
    ...S.tasks.filter(t=>t.date===iso&&t.status!=='done').map(t=>({id:t.id,title:t.title,type:'prazo',time:t.time,clientId:t.clientId,_k:'task'}))];
  return L.sort((a,b)=>String(a.time||'99').localeCompare(String(b.time||'99')));
}
function evCard(e){
  const c=catOf(e.type);
  return `<div class="ag-card" onclick="${e._k==='event'?`editEvent('${e.id}')`:e._k==='training'?`editTraining('${e.id}')`:`editTask('${e.id}')`}">
    <span class="rail" style="background:${c.c}"></span>
    <span class="hr">${esc(e.time||'—')}${e.endTime?'<br>'+esc(e.endTime):''}</span>
    <div style="min-width:0;flex:1"><b style="font-size:14px;display:block">${esc(e.title)}</b>
      <span class="tiny mut">${c.l}${e.clientId?' · '+esc(cname(e.clientId)):''}${e.place?' · '+esc(e.place):''}</span></div>
  </div>`;
}
ROUTES.agenda=()=>{
  const base=new Date(AG.sel+'T12:00:00');
  const titulo = AG.view==='mes' ? base.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})
    : AG.view==='semana' ? 'Semana de '+fmtDS(addDays(AG.sel,-base.getDay()))
    : base.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
  let corpo='';
  if(AG.view==='mes'){
    const y=base.getFullYear(), m=base.getMonth();
    const start=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate(), pdim=new Date(y,m,0).getDate();
    const cells=[];
    for(let i=start-1;i>=0;i--)cells.push({d:pdim-i,out:true});
    for(let d=1;d<=dim;d++)cells.push({d,iso:`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`});
    while(cells.length%7)cells.push({d:'',out:true});
    corpo=`<div class="glass" style="padding:16px">
      <div class="ag-grid">${['dom','seg','ter','qua','qui','sex','sáb'].map(d=>`<div class="ag-dow">${d}</div>`).join('')}</div>
      <div class="ag-grid">${cells.map(c=>{
        if(c.out)return `<div class="ag-day out"><span class="n">${c.d}</span></div>`;
        const E=dayEvents(c.iso), cores=[...new Set(E.map(e=>catOf(e.type).c))].slice(0,4);
        return `<div class="ag-day ${c.iso===today()?'today':''} ${c.iso===AG.sel?'sel':''}" onclick="tapDay('${c.iso}')" ondblclick="dayActions('${c.iso}')">
          <span class="n">${c.d}</span><div class="ag-dots">${cores.map(x=>`<span class="ag-dot" style="background:${x}"></span>`).join('')}</div></div>`}).join('')}</div></div>
      <div class="sec-t">${new Date(AG.sel+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</div>
      <div class="day-actions">
        <button class="btn p" onclick="dayActions('${AG.sel}')">${ic('plus')}Adicionar neste dia</button>
      </div><div style="height:12px"></div>
      <div class="grid" style="gap:9px">${dayEvents(AG.sel).map(evCard).join('')
        ||`<div class="glass empty" style="padding:30px">${ic('cal')}<h4 style="margin-top:8px">Dia livre</h4><p>Toque duas vezes em um dia para criar um compromisso.</p></div>`}</div>`;
  }
  if(AG.view==='semana'){
    const ini=addDays(AG.sel,-base.getDay());
    corpo=`<div class="ag-week">${[...Array(7)].map((_,i)=>{const iso=addDays(ini,i),E=dayEvents(iso),d=new Date(iso+'T12:00:00');
      return `<div class="ag-wcol ${iso===today()?'today':''}" ondblclick="dayActions('${iso}')">
        <div class="row" style="margin-bottom:7px"><span class="tiny mut" style="font-weight:640">${d.toLocaleDateString('pt-BR',{weekday:'short'})} ${d.getDate()}</span>

   ========================================================= */
const BUCKET='hub-docs';
const fmtBytes=b=>b>1048576?(b/1048576).toFixed(1)+' MB':(b/1024).toFixed(0)+' KB';
async function uploadDocs(files,linkType,linkId){
  if(!sb||!ME){toast('Faça login para anexar','err');return}
  for(const f of files){
    if(f.size>25*1024*1024){toast(f.name+' passa de 25 MB','err');continue}
    const path=`${ME.id}/${crypto.randomUUID()}-${f.name.replace(/[^\w.\-]+/g,'_')}`;
    const {error}=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type||'application/octet-stream'});
    if(error){toast('Falha ao enviar '+f.name,'err');console.error(error);continue}
    S.docs.unshift({id:uid(),name:f.name,type:(f.name.split('.').pop()||'').toUpperCase(),size:fmtBytes(f.size),
      mime:f.type||'',path,linkType:linkType||'',linkId:linkId||'',date:today()});
    toast('Documento anexado com sucesso');
  }
  save(); router();
}
async function openDoc(id,download){
  const d=byId('docs',id);
  if(!d?.path){toast('Este registro não tem arquivo salvo','err');return}
  const {data,error}=await sb.storage.from(BUCKET).createSignedUrl(d.path,60,download?{download:d.name}:{});
  if(error||!data){toast('Não foi possível abrir o arquivo','err');return}
  window.open(data.signedUrl,'_blank');
}
async function delDoc(id){
  const d=byId('docs',id);
  confirmDel('Excluir o documento '+d.name+'?',async()=>{
    if(d.path) await sb.storage.from(BUCKET).remove([d.path]);
    S.docs=S.docs.filter(x=>x.id!==id); save(); toast('Documento excluído'); router();
  });
}
function pickDocs(linkType,linkId){

  i.onchange=()=>uploadDocs([...i.files],linkType,linkId); i.click();
}

<script>
/* =========================================================
   IMPORTAR ORÇAMENTO FEITO FORA DO SISTEMA (PDF)
   Leitura local: o arquivo não sai do seu navegador.
   ========================================================= */
let pdfjsReady=null;
function loadPdfJs(){
  if(pdfjsReady)return pdfjsReady;
  pdfjsReady=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(); };
    s.onerror=rej; document.head.appendChild(s);
  });
  return pdfjsReady;
}
async function pdfText(file){
  await loadPdfJs();
  const buf=await file.arrayBuffer();
  const doc=await window.pdfjsLib.getDocument({data:buf}).promise;
  let out='';
  for(let i=1;i<=doc.numPages;i++){
    const pg=await doc.getPage(i);
    const tc=await pg.getTextContent();
    let last=null, line='';
    tc.items.forEach(it=>{
      const y=Math.round(it.transform[5]);
      if(last!==null&&Math.abs(y-last)>3){out+=line.trim()+'\n';line=''}
      line+=it.str+' '; last=y;
    });
    out+=line.trim()+'\n';
  }
  return out;
}
const brl=s=>parseFloat(String(s).replace(/\./g,'').replace(',','.'))||0;

function parseBudget(txt){
  const T=txt.replace(/\u00a0/g,' ');
  const linhas=T.split('\n').map(l=>l.trim()).filter(Boolean);
  const r={raw:T};

  // valores em reais
  const vals=[...T.matchAll(/R\$\s*([\d.]{1,12},\d{2})/g)].map(m=>({v:brl(m[1]),i:m.index}));
  // total: prefere o valor que vem depois de palavras de fechamento
  const chaveTotal=/(investimento\s+total|valor\s+total|total\s+geral|total\s+a\s+pagar|^total)/i;
  let total=0;
  linhas.forEach(l=>{ if(chaveTotal.test(l)){ const m=l.match(/R\$\s*([\d.]{1,12},\d{2})/); if(m)total=Math.max(total,brl(m[1])) } });
  if(!total&&vals.length)total=Math.max(...vals.map(v=>v.v));
  r.total=total;

  // documento e contato
  r.cnpj=(T.match(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/)||[])[0]||'';
  r.cpf=(T.match(/\b\d{3}\.\d{3}\.\d{3}-\d{2}\b/)||[])[0]||'';
  r.email=(T.match(/[\w.\-+]+@[\w\-]+\.[\w.\-]+/)||[])[0]||'';
  r.fone=(T.match(/\(?\d{2}\)?\s?9?\d{4}[-\s]?\d{4}/)||[])[0]||'';

  // datas
  const datas=[...T.matchAll(/(\d{2})\/(\d{2})\/(\d{4})/g)].map(m=>`${m[3]}-${m[2]}-${m[1]}`);
  r.date=datas[0]||today(); r.validity=datas[1]||addDays(r.date,S.settings.validity||15);

  // número do orçamento
  r.code=(T.match(/\b(?:ORC|ORÇ|ORCAMENTO|PROPOSTA)[\s\-Nn°º:]*([\w\-\/]{3,20})/i)||[])[0]||'';

  // cliente: primeiro tenta bater com quem já existe
  let cli=null;
  if(r.cnpj) cli=S.clients.find(c=>onlyNum(c.doc)===onlyNum(r.cnpj));
  if(!cli){
    const low=T.toLowerCase();
    cli=S.clients.find(c=>{
      const n=(c.fantasy||c.name).toLowerCase();
      return n.length>4 && low.includes(n);
    });
  }
  r.clientId=cli?cli.id:'';
  if(!cli){
    const m=T.match(/(?:cliente|empresa|raz[ãa]o social|contratante)\s*[:\-]\s*(.{3,70})/i);
    r.clientName=m?m[1].split(/\s{2,}|CNPJ|CPF/i)[0].trim():'';
  }else r.clientName=cli.fantasy||cli.name;

  // serviço: bate com o catálogo, depois procura NR, depois usa uma linha descritiva
  let svc=S.services.find(s=>{
    const n=s.name.split('—')[0].trim().toLowerCase();
    return n.length>3 && T.toLowerCase().includes(n);
  });
  const nr=(T.match(/\bNR[\s\-]?(\d{1,2})\b/i)||[])[0];
  if(!svc&&nr) svc=S.services.find(s=>onlyNum(s.nr)===onlyNum(nr));
  r.serviceId=svc?svc.id:'';
  r.desc = svc?svc.name : (linhas.find(l=>/trein|curso|servi[çc]o|laudo|inspe[çc]|projeto|site|consultoria|NR[\s\-]?\d/i.test(l)&&l.length>8&&l.length<90)||'Serviço orçado');

  // quantidade e valor unitário
  const q=T.match(/(\d{1,4})\s*(participantes?|colaboradores?|funcion[áa]rios?|alunos?|m[áa]quinas?|pessoas?)/i);
  r.qty=q?+q[1]:1;
  r.unit=q?q[2].toLowerCase().replace(/s$/,''):(svc?svc.unit:'projeto');
  r.price=r.qty>0?+(r.total/r.qty).toFixed(2):r.total;

  // carga horária
  const h=T.match(/(\d{1,3})\s*(?:h|horas)\b/i); r.hours=h?+h[1]:'';
  return r;
}

  modal({title:'Lendo o orçamento…',body:`<div class="grid" style="gap:10px">

    <span class="tiny mut3">${esc(file.name)} — o arquivo é lido aqui no seu navegador.</span></div>`});
  let d;
  try{ const txt=await pdfText(file);
    if(txt.replace(/\s/g,'').length<40){closeModal();toast('Este PDF não tem texto — parece ser digitalizado','err');return}
    d=parseBudget(txt);
  }catch(e){ console.error(e); closeModal(); toast('Não consegui ler este PDF','err'); return }
  confirmImport(d,file);
}
function confirmImport(d,file){
  const fields=[
    {k:'clientId',l:'Cliente',t:'select',o:[['','— criar novo com o nome lido —'],...S.clients.map(c=>[c.id,c.fantasy||c.name])]},
    {k:'clientName',l:'Nome do cliente (se for novo)'},
    {k:'desc',l:'Serviço / descrição',w:'full',req:true},
    {k:'qty',l:'Quantidade',t:'number'},{k:'unit',l:'Unidade'},
    {k:'price',l:'Valor unitário (R$)',t:'number'},{k:'total',l:'Valor total (R$)',t:'number',req:true},
    {k:'date',l:'Data do orçamento',t:'date'},{k:'validity',l:'Validade',t:'date'},
    {k:'status',l:'Situação',t:'select',o:Object.entries(BS).map(([k,v])=>[k,v.l])},
    {k:'code',l:'Número (deixe vazio para gerar)'},
    {k:'anexar',l:'Anexar o PDF original ao orçamento',t:'check'}
  ];
  const vals={...d,status:'enviado',anexar:true,code:''};
  const achou=[];
  if(d.total)achou.push('valor '+money(d.total));
  if(d.clientName)achou.push('cliente');
  if(d.serviceId)achou.push('serviço do catálogo');
  if(d.cnpj)achou.push('CNPJ');
  openForm({title:'Conferir antes de salvar',wide:true,fields,values:vals,
    extra:`<div class="tiny mut3" style="margin-top:12px">Lido de <b>${esc(file.name)}</b>${achou.length?' — reconheci '+achou.join(', ')+'.':''} Confira e corrija o que estiver errado antes de salvar.</div>`,
    onSave:async v=>{
      let cid=v.clientId;
      if(!cid){
        const nome=v.clientName||'Cliente importado';
        const novo={id:uid(),name:nome,fantasy:nome,doc:d.cnpj||d.cpf||'',email:d.email||'',phone:d.fone||'',whatsapp:onlyNum(d.fone||''),
          city:'',state:'PR',segment:'',origin:'outro',notes:'Criado ao importar orçamento em PDF',fav:false,createdAt:today()};
        S.clients.unshift(novo); cid=novo.id;
      }
      const qty=+v.qty||1, total=+v.total||0, price=+v.price||(qty?total/qty:total);
      const b={id:uid(),code:v.code||nextCode(),type:d.serviceId?'sst':'outro',clientId:cid,date:v.date||today(),
        validity:v.validity||addDays(v.date||today(),S.settings.validity||15),
        items:[{id:uid(),serviceId:d.serviceId||'',desc:v.desc,qty,unit:v.unit||'projeto',price,discount:0}],
        discount:0,addition:0,taxes:0,scope:'Orçamento elaborado fora do sistema e importado a partir do PDF original.',
        content:[],conditions:S.settings.conditions||'',notes:'',status:v.status||'enviado',
        total, owner:'Leonardo',nextAction:v.status==='enviado'?'Follow-up da proposta':'',
        nextActionDate:v.status==='enviado'?addDays(v.date||today(),S.settings.followupDays||3):'',
        versions:[],timeline:[]};
      // o total informado manda: ajusta o item para bater com ele
      const calc=budgetTotal(b);
      if(Math.abs(calc.total-total)>0.5){ b.items[0].price=+(total/(qty||1)).toFixed(2); }
      log(b,'Importado do PDF '+file.name);
      S.budgets.unshift(b);
      if(v.anexar){ try{ await uploadDocs([file],'budget',b.id) }catch(e){ toast('Orçamento salvo, mas o anexo falhou','err') } }
      save(); toast('Orçamento '+b.code+' importado'); go('orcamento/'+b.id);
    }});
}
</script>

  content:['Organização e atribuições da CIPA;','Mapa de risco e inspeções de segurança;','Investigação e análise de acidentes;','Noções sobre acidentes e doenças do trabalho;','SIPAT e campanhas internas;','Legislação aplicável.']},
 'NR-11':{course:'NR-11 – Operador de Empilhadeira',hours:16,color:'#7C2D12',accent:'#FB923C',
  legal:'conforme exigência da NR-11',
  texto:(d)=>`de ${d.course}, com aprovação satisfatória teórico e prático, fornecido pela empresa ${d.company} inscrita no CNPJ: ${d.cnpj}, realizado ${d.periodo} com carga horária de ${d.h} horas ${d.legal}.`,
  content:['Legislação e responsabilidades do operador;','Componentes e sistemas da empilhadeira;','Checklist e inspeção diária;','Estabilidade de carga e centro de gravidade;','Movimentação, empilhamento e circulação;','Prática operacional supervisionada.']},
 'NR-23':{course:'Brigada de Incêndio / Prevenção e Combate a Incêndio',hours:16,color:'#7F1D1D',accent:'#EF4444',
  legal:'conforme exigência da NR-23',
  texto:(d)=>`de ${d.course}, com aprovação satisfatória teórico e prático, fornecido pela empresa ${d.company} inscrita no CNPJ: ${d.cnpj}, realizado ${d.periodo} com carga horária de ${d.h} horas ${d.legal}.`,
  content:['Teoria do fogo e classes de incêndio;','Agentes e equipamentos de extinção;','Prática com extintores e mangueiras;','Abandono de área e ponto de encontro;','Primeiros socorros e APH básico;','Simulado de emergência.']},
 'NR-10':{course:'NR-10 – Segurança em Instalações e Serviços em Eletricidade',hours:40,color:'#1E3A8A',accent:'#60A5FA',
  legal:'conforme exigência da NR-10',
  texto:(d)=>`de ${d.course}, com aprovação satisfatória, fornecido pela empresa ${d.company} inscrita no CNPJ: ${d.cnpj}, realizado ${d.periodo} com carga horária de ${d.h} horas ${d.legal}.`,
  content:['Introdução à segurança com eletricidade;','Riscos elétricos: choque, arco elétrico e campos eletromagnéticos;','Técnicas de análise de risco;','Medidas de controle e desenergização;','Equipamentos de proteção coletiva e individual;','Rotinas de trabalho e documentação;','Primeiros socorros e responsabilidades.']}
};
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const dataExtenso=d=>{const x=new Date(d+'T12:00:00');return `${x.getDate()} de ${MESES[x.getMonth()]} de ${x.getFullYear()}`};
const maskCPF=v=>{const n=onlyNum(v).slice(0,11);return n.length===11?n.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):v};
function nextCert(){
  const ano=new Date().getFullYear();
  const usados=new Set((S.certificates||[]).map(c=>c.code));
  let n=1,code;
  do{ code=`CERT-${ano}-${String(n).padStart(4,'0')}`; n++; }while(usados.has(code));
  return code;
}

<script>
/* ---------- PDF do certificado: frente + verso, seguindo os modelos ---------- */
async function certPDF(list,juntar=true){
  try{ await loadPDF(); }catch(e){ toast('Não foi possível carregar o gerador de PDF','err'); return }
  const {jsPDF}=window.jspdf;
  const st=S.settings||{};
  const sig=st.signature||SIG_DEFAULT;
  const doc=new jsPDF({unit:'mm',format:[297,210],orientation:'landscape'});
  const W=297,H=210;
  list.forEach((c,idx)=>{
    if(idx>0)doc.addPage([297,210],'landscape');
    const t=NRT[c.nr]||{color:'#111714',accent:'#00C853'};
    const curso=c.course||t.course||'';
    const hex=h=>{const n=parseInt(h.slice(1),16);return [n>>16,(n>>8)&255,n&255]};
    const CO=hex(t.color), AC=hex(t.accent||'#F5B301');

    /* ---- FRENTE ---- */
    const BH=80;                                   // altura da faixa superior
    const foto=(st.banners&&st.banners[c.nr])||BANNERS[c.nr]||null;
    if(foto){
      try{ doc.addImage(foto,'JPEG',0,0,W,BH); }catch(e){ doc.setFillColor(...CO); doc.rect(0,0,W,BH,'F'); }
      // apenas um leve escurecimento neutro, para o título branco ler bem
      doc.setFillColor(0,0,0); doc.setGState(new doc.GState({opacity:.30})); doc.rect(0,0,W,BH,'F');
      doc.setGState(new doc.GState({opacity:1}));
    }else{
      // arte própria: base escura com geometria diagonal na cor da norma
      doc.setFillColor(...CO); doc.rect(0,0,W,BH,'F');
      doc.setGState(new doc.GState({opacity:.16})); doc.setFillColor(...AC);
      doc.triangle(0,0,74,0,0,BH,'F'); doc.triangle(W,0,W,BH,W-96,BH,'F');
      doc.setGState(new doc.GState({opacity:.10}));
      for(let i=0;i<9;i++) doc.triangle(96+i*13,BH,104+i*13,BH,120+i*13,0,'F');
      doc.setGState(new doc.GState({opacity:1}));
    }
    doc.setFillColor(...AC); doc.rect(0,BH,W,3.4,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(52);
    doc.text('C E R T I F I C A D O',W/2,BH/2+7,{align:'center'});
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    doc.setTextColor(240,240,240);
    doc.text((st.fantasy||'PROTECWORK TREINAMENTOS').toUpperCase(),W/2,BH/2+18,{align:'center'});
    // moldura discreta da página
    doc.setDrawColor(...AC); doc.setLineWidth(.7); doc.rect(6,6,W-12,H-12,'S');
    // selo oficial da norma
    const selo=SELOS[c.nr];
    if(selo){ try{ doc.addImage(selo,'PNG',W-70,92,42,42); }catch(e){} }

    doc.setTextColor(60,60,60); doc.setFont('helvetica','normal'); doc.setFontSize(13);
    doc.text('CERTIFICAMOS QUE',W/2,97,{align:'center'});
    doc.setTextColor(20,20,20); doc.setFont('helvetica','bold'); doc.setFontSize(27);
    doc.text(c.person_name||'',W/2,112,{align:'center'});
    doc.setFontSize(20);
    doc.text('CPF: '+maskCPF(c.cpf||''),W/2,124,{align:'center'});
    doc.setFont('helvetica','normal'); doc.setFontSize(13); doc.setTextColor(60,60,60);
    doc.text('PARTICIPOU DO CURSO',W/2,136,{align:'center'});

    const periodo = c.end_date&&c.end_date!==c.issue_date
      ? `no período de ${fmtD(c.issue_date)} a ${fmtD(c.end_date)}`
      : `no dia ${fmtD(c.issue_date)}`;
    const corpo = t.texto ? t.texto({course:curso,company:st.fantasy||'Protecwork Treinamentos',cnpj:st.cnpj||'',
        dt:fmtD(c.issue_date),h:c.hours,legal:c.legal||t.legal||'',periodo})
      : `de ${curso}, fornecido pela empresa ${st.fantasy||''} inscrita no CNPJ: ${st.cnpj||''}, realizado ${periodo} com carga horária de ${c.hours} horas.`;
    doc.setTextColor(35,35,35); doc.setFontSize(13.5);
    const linhas=doc.splitTextToSize(corpo,W-56);
    let y=148;
    linhas.forEach(l=>{ doc.text(l,W/2,y,{align:'center'}); y+=7.4 });

    // rodapé em três colunas, como nos seus modelos
    const fy=190;
    doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(25,25,25);
    doc.text('CARGA HORÁRIA',W*0.19,fy,{align:'center'});
    doc.text('NOME DO INSTRUTOR',W*0.5,fy,{align:'center'});
    doc.text('DATA',W*0.81,fy,{align:'center'});
    doc.setFont('helvetica','normal'); doc.setTextColor(70,70,70); doc.setFontSize(11);
    doc.text(c.hours+' horas',W*0.19,fy+6,{align:'center'});
    doc.text(st.instructor||'Leonardo Vinicius Santos',W*0.5,fy+6,{align:'center'});
    doc.text(fmtD(c.issue_date),W*0.81,fy+6,{align:'center'});
    doc.setFontSize(8); doc.setTextColor(150,150,150);
    doc.text(c.code||'',W-12,204,{align:'right'});

    /* ---- VERSO: conteúdo programático + assinatura ---- */
    doc.addPage([297,210],'landscape');
    doc.setFillColor(...CO); doc.rect(0,0,W,13,'F');
    doc.setFillColor(...AC); doc.rect(0,13,W,2.2,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text((c.nr||'')+' — '+(curso||'').toUpperCase().slice(0,70),12,8.6);
    doc.text(c.code||'',W-12,8.6,{align:'right'});
    doc.setDrawColor(...AC); doc.setLineWidth(.7); doc.rect(6,19,W-12,H-25,'S');
    doc.setTextColor(20,20,20); doc.setFont('helvetica','bold'); doc.setFontSize(17);
    doc.text('CONTEÚDO PROGRAMÁTICO DESTE TREINAMENTO:',20,32);
    doc.setFont('helvetica','normal'); doc.setFontSize(11.5); doc.setTextColor(45,45,45);
    let cy2=44;
    const itens=(c.content&&c.content.length?c.content:(t.content||[]));
    itens.forEach(it=>{
      const ls=doc.splitTextToSize('•  '+it,W-150);
      ls.forEach(l=>{ if(cy2>128){return} doc.text(l,22,cy2); cy2+=6.2 });
    });
    // selo da NR no canto
    if(SELOS[c.nr]){ try{ doc.addImage(SELOS[c.nr],'PNG',W-86,32,54,54); }catch(e){} }

    // assinatura + carimbo
    try{ doc.addImage(sig,'JPEG',34,142,54,38); }catch(e){}
    doc.setDrawColor(60,60,60); doc.setLineWidth(.5);
    doc.line(28,181,116,181); doc.line(176,181,268,181);
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(25,25,25);
    doc.text(st.instructor||'Leonardo Vinicius Santos',72,187,{align:'center'});
    doc.setFontSize(10);
    doc.text('Instrutor do Curso e Responsável Técnico',72,192.5,{align:'center'});
    doc.text('Técnico em Segurança do Trabalho',72,198,{align:'center'});
    doc.text(st.register||'002581/PR',72,203.5,{align:'center'});
    doc.text(c.person_name||'',222,187,{align:'center'});
    doc.setFont('helvetica','normal');
    doc.text('CPF: '+maskCPF(c.cpf||''),222,193,{align:'center'});
  });
  const nome = list.length===1
    ? `${(list[0].person_name||'certificado').replace(/[^\w]+/g,'_')}_${(list[0].nr||'').replace('-','')}.pdf`
    : `certificados_${list[0].nr||''}_${today()}.pdf`;
  try{ doc.save(nome) }catch(e){ window.open(doc.output('bloburl'),'_blank') }
  toast(list.length>1?list.length+' certificados gerados':'Certificado gerado');
}

/* ---------- emissão ---------- */
function certFields(){
  return [
    {k:'nr',l:'Norma / curso',t:'select',req:true,o:Object.keys(NRT).map(k=>[k,k+' — '+NRT[k].course.slice(0,42)])},
    {k:'person_name',l:'Nome completo',req:true,w:'full',hint:'Se já emitiu antes, digite as primeiras letras e escolha na lista'},
    {k:'cpf',l:'CPF',req:true},{k:'hours',l:'Carga horária (h)',t:'number'},
    {k:'issue_date',l:'Data do treinamento',t:'date'},{k:'end_date',l:'Data final (se mais de um dia)',t:'date'},
    {k:'clientId',l:'Empresa do participante',t:'select',o:[['','—'],...S.clients.map(c=>[c.id,c.fantasy||c.name])]}
  ];
}
function pessoasConhecidas(){
  const m=new Map();
  [...(S.certificates||[]),...(S.validities||[])].forEach(x=>{ if(x.person_name&&!m.has(x.person_name))m.set(x.person_name,x.cpf||'') });
  return [...m.entries()];
}
function ligarAutocomplete(v){
  const nome=v.querySelector('[name=person_name]'), cpf=v.querySelector('[name=cpf]');
  if(!nome)return;
  const lista=pessoasConhecidas(); if(!lista.length)return;
  const dl=document.createElement('datalist'); dl.id='dl_pessoas';
  dl.innerHTML=lista.map(([n])=>`<option value="${esc(n)}"></option>`).join('');
  v.appendChild(dl); nome.setAttribute('list','dl_pessoas');
  nome.addEventListener('change',()=>{ const p=lista.find(([n])=>n===nome.value); if(p&&cpf&&!cpf.value)cpf.value=p[1] });
}
function newCert(pre={}){
  const nr=pre.nr||'NR-35';
  openForm({title:'Emitir certificado',wide:true,fields:certFields(),
    values:{nr,hours:NRT[nr].hours,issue_date:today(),end_date:'',...pre},
    onSave:async d=>{
      const c=mkCert(d); S.certificates.unshift(c);
      if(typeof VALIDADE_PADRAO!=='undefined'){
        S.validities.unshift({id:uid(),person_name:c.person_name,cpf:c.cpf,nr:c.nr,course:c.course,
          done_date:c.issue_date,months:VALIDADE_PADRAO[c.nr]||24,clientId:c.clientId||'',certificateId:c.id,notes:''});
      }
      save();
      toast('Certificado '+c.code+' emitido'); await certPDF([c]); router();
    }});
}
function mkCert(d){
  const t=NRT[d.nr]||{};
  return {id:uid(),code:nextCert(),person_name:d.person_name.trim(),cpf:maskCPF(d.cpf),nr:d.nr,
    course:t.course||d.nr,hours:+d.hours||t.hours||0,issue_date:d.issue_date||today(),end_date:d.end_date||'',
    clientId:d.clientId||'',trainingId:d.trainingId||'',content:(t.content||[]).slice(),legal:t.legal||'',notes:''};
}
/* várias pessoas de uma vez: cola a lista */
function batchCert(pre={}){
  const nr=pre.nr||'NR-35';
  modal({title:'Emitir vários certificados',wide:true,body:`
    <div class="fgrid">
      <label class="f">Norma / curso<select id="b_nr">${Object.keys(NRT).map(k=>`<option value="${k}" ${k===nr?'selected':''}>${k} — ${esc(NRT[k].course.slice(0,40))}</option>`).join('')}</select></label>
      <label class="f">Carga horária (h)<input type="number" id="b_h" value="${NRT[nr].hours}"></label>
      <label class="f">Data do treinamento<input type="date" id="b_d" value="${pre.issue_date||today()}"></label>
      <label class="f">Data final (se houver)<input type="date" id="b_d2" value="${pre.end_date||''}"></label>
      <label class="f full">Empresa do participante<select id="b_c"><option value="">—</option>${S.clients.map(c=>`<option value="${c.id}" ${pre.clientId===c.id?'selected':''}>${esc(c.fantasy||c.name)}</option>`).join('')}</select></label>
      <label class="f full">Participantes — um por linha, no formato <b>Nome, CPF</b>
        <textarea id="b_l" rows="9" placeholder="Pedro Ernesto Lourenço da Silva, 009.704.199-88&#10;Thiago Barbosa Schemberger, 079.779.869-22"></textarea></label>
    </div>
    <div class="tiny mut3" style="margin-top:10px">Sai um único PDF com todos, cada um com frente e verso. Também dá para colar a lista copiada de uma planilha.</div>`,
    footer:`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn p" id="bok">Emitir e gerar PDF</button>`,
    onOpen:v=>{
      v.querySelector('#b_nr').onchange=e=>{v.querySelector('#b_h').value=NRT[e.target.value].hours};
      v.querySelector('#bok').onclick=async()=>{
        const linhas=v.querySelector('#b_l').value.split('\n').map(l=>l.trim()).filter(Boolean);
        if(!linhas.length){toast('Cole ao menos um participante','err');return}
        const base={nr:v.querySelector('#b_nr').value,hours:+v.querySelector('#b_h').value,
          issue_date:v.querySelector('#b_d').value,end_date:v.querySelector('#b_d2').value,clientId:v.querySelector('#b_c').value};
        const novos=[];
        linhas.forEach(l=>{
          const p=l.split(/[,;\t]/);
          const nome=(p[0]||'').trim(); const cpf=(p[1]||'').trim();
          if(!nome)return;
          const c=mkCert({...base,person_name:nome,cpf}); S.certificates.unshift(c); novos.push(c);
          if(typeof VALIDADE_PADRAO!=='undefined')S.validities.unshift({id:uid(),person_name:c.person_name,cpf:c.cpf,
            nr:c.nr,course:c.course,done_date:c.issue_date,months:VALIDADE_PADRAO[c.nr]||24,clientId:c.clientId||'',certificateId:c.id,notes:''});
        });
        save(); closeModal();
        toast(novos.length+' certificados emitidos');
        await certPDF(novos); router();
      };
    }});
}
/* a partir de uma turma já cadastrada */
function certFromTraining(){
  const turmas=S.trainings.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  if(!turmas.length){toast('Nenhuma turma cadastrada','err');return}
  modal({title:'Emitir pela turma',body:`
    <label class="f">Turma<select id="t_id">${turmas.map(t=>`<option value="${t.id}">${esc(sname(t.serviceId))} — ${esc(cname(t.clientId))} — ${fmtD(t.date)}</option>`).join('')}</select></label>
    <div class="tiny mut3" style="margin-top:11px">Os dados da turma preenchem norma, carga horária, data e empresa. Depois é só colar os nomes.</div>`,
    footer:`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn p" id="tok">Continuar</button>`,
    onOpen:v=>{ v.querySelector('#tok').onclick=()=>{
      const t=byId('trainings',v.querySelector('#t_id').value);
      const s=byId('services',t.serviceId);
      const nr=(s&&s.nr&&NRT[s.nr])?s.nr:'NR-35';
      closeModal();
      batchCert({nr,issue_date:t.date,clientId:t.clientId,hours:t.hours});
    }}});
}
function delCert(id){
  const c=byId('certificates',id);
  confirmDel('Excluir o certificado '+c.code+' de '+c.person_name+'?',()=>{
    S.certificates=S.certificates.filter(x=>x.id!==id); save(); toast('Certificado excluído'); router();
  });
}
ROUTES.certificados=()=>{
  const q=(window.__certq||'').toLowerCase();
  const L=(S.certificates||[]).filter(c=>!q||(c.person_name+c.cpf+c.nr+c.code).toLowerCase().includes(q))
    .sort((a,b)=>String(b.issue_date).localeCompare(String(a.issue_date)));
  const porNR={}; (S.certificates||[]).forEach(c=>porNR[c.nr]=(porNR[c.nr]||0)+1);
  const top=Object.entries(porNR).sort((a,b)=>b[1]-a[1])[0];
  return `<div class="page-h reveal">
    <div><h1>Certificados</h1><p>Nome, CPF e data — o certificado sai pronto, assinado e com o conteúdo programático no verso.</p></div>
    <div class="row wrap" style="gap:8px">
      <button class="btn" onclick="certFromTraining()">${ic('helmet')}Pela turma</button>
      <button class="btn" onclick="batchCert()">${ic('users')}Vários de uma vez</button>
      <button class="btn p" onclick="newCert()">${ic('plus')}Emitir certificado</button>
    </div></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:14px">
    <div class="glass kpi"><div class="lab"><i style="color:var(--g2)">${ic('doc')}</i>Emitidos</div><div class="val">${(S.certificates||[]).length}</div><div class="sub">no total</div></div>
    <div class="glass kpi"><div class="lab"><i style="color:var(--info)">${ic('cal')}</i>Neste mês</div><div class="val">${(S.certificates||[]).filter(c=>String(c.issue_date).slice(0,7)===today().slice(0,7)).length}</div><div class="sub">certificados</div></div>
    <div class="glass kpi"><div class="lab"><i style="color:var(--warn)">${ic('helmet')}</i>Norma mais emitida</div><div class="val" style="font-size:21px">${top?esc(top[0]):'—'}</div><div class="sub">${top?top[1]+' certificados':'sem dados'}</div></div>
    <div class="glass kpi"><div class="lab"><i style="color:var(--g2)">${ic('check')}</i>Próximo número</div><div class="val" style="font-size:19px">${nextCert()}</div><div class="sub">numeração automática</div></div>
  </div>
  <input placeholder="Buscar por nome, CPF, norma ou número…" value="${esc(window.__certq||'')}" style="margin-bottom:13px"
    oninput="window.__certq=this.value;clearTimeout(window.__cqt);window.__cqt=setTimeout(router,260)">
  ${L.length?`<div class="glass tbl-wrap"><table>
    <thead><tr><th>Número</th><th>Participante</th><th>CPF</th><th>Norma</th><th>Carga</th><th>Data</th><th>Empresa</th><th></th></tr></thead>
    <tbody>${L.map(c=>`<tr class="card-row">
      <td class="mono td-code"><b>${esc(c.code)}</b></td>
      <td class="td-client"><b>${esc(c.person_name)}</b></td>
      <td class="mono" data-l="CPF">${esc(c.cpf||'')}</td>
      <td data-l="Norma"><span class="chip">${esc(c.nr)}</span></td>
      <td class="mono" data-l="Carga">${c.hours}h</td>
      <td class="mono" data-l="Data">${fmtD(c.issue_date)}</td>
      <td class="tiny mut" data-l="Empresa">${esc(c.clientId?cname(c.clientId):'—')}</td>
      <td class="td-acts"><div class="row" style="gap:5px">
        <button class="btn sm" title="Gerar PDF" onclick="certPDF([byId('certificates','${c.id}')])">${ic('pdf')}</button>
        <button class="btn sm" title="Excluir" onclick="delCert('${c.id}')">${ic('trash')}</button>
      </div></td></tr>`).join('')}</tbody></table></div>
    ${L.length>1?`<div class="row" style="margin-top:13px"><button class="btn" onclick="certPDF(S.certificates.filter(c=>${JSON.stringify(L.map(x=>x.id))}.includes(c.id)))">${ic('dl')}Baixar todos em um PDF</button></div>`:''}`
  :`<div class="glass empty">${ic('doc')}<h4 style="margin-top:8px">Nenhum certificado emitido</h4>
     <p>Escolha a norma, digite nome, CPF e data — o resto vem pronto, inclusive sua assinatura.</p>
     <div class="row" style="gap:8px;margin-top:12px;justify-content:center"><button class="btn p" onclick="newCert()">${ic('plus')}Emitir o primeiro</button></div></div>`}`;
};
</script>

<script>
/* =========================================================
   VENCIMENTO DE TREINAMENTOS
   ========================================================= */
const VALIDADE_PADRAO={'NR-05':12,'NR-06':24,'NR-10':24,'NR-11':36,'NR-12':24,'NR-18':12,'NR-20':24,'NR-23':12,'NR-33':12,'NR-34':12,'NR-35':24};
const AVISO_DIAS=30;
function venceEm(v){
  if(!v.done_date)return '';
  const d=new Date(v.done_date+'T12:00:00');
  d.setMonth(d.getMonth()+(+v.months||24));
  return d.toISOString().slice(0,10);
}
function statusVal(v){
  const exp=venceEm(v); if(!exp)return{k:'sem',l:'Sem data',c:'var(--tx3)',dias:null};
  const dias=diffDays(exp,today());
  if(dias<0)return{k:'vencido',l:'Vencido',c:'var(--err)',dias};
  if(dias<=AVISO_DIAS)return{k:'vencendo',l:`Vence em ${dias}d`,c:'var(--warn)',dias};
  return{k:'ok',l:'Em dia',c:'var(--g2)',dias};
}

    fields:[
